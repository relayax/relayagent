schema: relay/v1
name: "@local/orders"
version: 0.1.0
display_name: "주문 비서"
description: "카드 한 줄. 지도, 카탈로그, 설치 화면이 이 문장을 그대로 쓴다."
icon: assets/icon.svg
publisher: "@local"          # 발행 주체 좌표 — 스토어 리스팅·정산이 읽는다 (선택)
released_at: "2026-08-14"    # 발행일 — 스토어 리스팅 메타 (선택)

surfaces:
  view:
    source: surfaces/view
    out: out
  components:                # 컴포넌트 수출 — 다른 패키지 화면이 마운트하는 자립 ESM(+선택 CSS).
    source: surfaces/components   # 계약은 index.js 의 mount(el, props) 수출 하나. React 로 저작하면 번들 안에 들어간다
    out: dist                     # out 미선언이면 source/index.js 를 그대로 서빙(빌드 없는 손저작)
  channels:
    - name: discord
      source: channels/discord
      entry: index.ts
    - name: slack
      source: channels/slack
      entry: index.ts

harness:
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      llm:
        provider: anthropic
        auth: { kind: oauth }
    - name: codex
      source: harness/codex
      entry: run
      llm:
        provider: openai
        auth: { kind: oauth }
  workdir: work/

hooks:
  deny:
    - ~/Documents/세무

agents:
  - name: orders
    default: true            # main 슬롯 착지점 (최대 1) — 미선언이면 "짧은 이름과 같은 에이전트" 관례
    persona: agents/orders/AGENT.md
    greeting: "무엇을 도와드릴까요?"   # 빈 대화의 첫 줄. 창구가 아니라 말하는 쪽 소속이다
    skills: agents/orders/skills
    commands: agents/orders/commands
    dispatch: [worker]
  - name: worker
    persona: agents/worker/AGENT.md
    scripts: [orders-*, report-weekly]

scripts:
  source: scripts

services:
  - name: sessions
    source: services/sessions
    dockerfile: Dockerfile
    disk: 1Gi
    resources: { memory: 512Mi, cpu: 0.5 }
    port: 8080
  - name: browser
    source: services/browser
    dockerfile: Dockerfile
    port: 9222
  - name: erp-events
    source: services/erp-events
    entry: index.ts
    port: 8090
  - name: inbox
    dir: ~/Documents/orders-inbox
  - name: erp
    url: https://erp.internal.example.com/mcp
    tools: [list-orders, get-order, create-draft-order]
    auth:
      kind: token
      env: ERP_TOKEN
      help:
        url: "https://erp.internal.example.com/settings/tokens"
        note: "본인 계정으로 API 토큰을 발급해 붙여넣으세요."
      verify:
        url: "https://erp.internal.example.com/api/me"
  - name: drive
    url: https://drive-mcp.example.com/mcp
    tools: [search, fetch]
    auth:
      kind: oauth
      client: registered
      oauth_client:
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
        auth_meta:
          authorization_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"
          token_endpoint: "https://oauth2.googleapis.com/token"
          authorize_params: { access_type: "offline", prompt: "consent" }
  # api = REST 베이스. 기판이 몸을 띄우지 않는 것은 url 형과 같고, 문의 말이 MCP 가 아닌 것만
  # 다르다. 동사는 ctx.service("shipping").fetch("/v1/labels", {…}) 로 부르고 자격은 손에 쥐지
  # 않는다 — 기판이 호출마다 붙이고, 요청은 이 base 접두 밖으로 나가지 못한다.
  # 몸 없는 커넥터 패키지는 이 선언 하나가 계약의 전부다
  - name: shipping
    api: https://api.shipping.example.com
    auth:
      kind: token
      help:
        url: "https://api.shipping.example.com/settings/tokens"
        note: "본인 계정으로 API 토큰을 발급해 붙여넣으세요."
      verify:
        url: "https://api.shipping.example.com/v1/me"

triggers:
  - id: daily-digest
    label: "아침 요약"
    when: { cron: "0 9 * * *", tz: "Asia/Seoul" }
    # delivery = 선톡 좌표 <채널이름>:<대화키> — 턴이 그 대화의 slot 에서 돌고 reply 가 채널로 발신된다
    then: { agent: orders, prompt: "어제 처리량을 요약해 주세요.", delivery: "discord:orders-daily" }
  - id: on-install
    when: { event: relay.package.installed, debounce_ms: 60000 }
    then: { agent: orders, prompt: "설치 직후 초기 설정 상태를 점검해 주세요.", route: "/orders" }
  - id: nightly-sync
    when: { cron: "0 3 * * *", tz: "Asia/Seoul" }
    then: { script: orders-sync }

missions:
  - name: product-context
    description: "제품 맥락(제품명, 포지셔닝, 핵심 기능, 타깃)을 질의에 답한다."

edges:
  - provider: "@relay/notion@^1"
    tools: [search, fetch]
  - provider: "@local/devteam"
    mission: product-context
  - provider: "@local/ui@^1"   # components 소비 — 기판이 화면에 import map 을 심는다
    components: true           # 화면 코드: import { mount } from "@local/ui"  (주소를 조립하지 않는다)

org:
  per_user:
    # 어휘 하나 — url·api·dir 서비스 이름, 또는 edge provider 좌표
    accounts: [erp, drive, shipping, "@relay/notion"]
    replicas: [browser]
