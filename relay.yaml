schema: relay/v1
name: "@local/orders"
version: 0.1.0
display_name: "주문 비서"
description: "카드 한 줄. 지도, 카탈로그, 설치 화면이 이 문장을 그대로 쓴다."
icon: assets/icon.svg
publisher: "@local"          # 발행 주체 좌표 — 스토어 리스팅·정산이 읽는다 (선택)
released_at: "2026-08-14"    # 발행일 — 스토어 리스팅 메타 (선택)

# 사이드바 자리(선택) — auto(기본): 다른 설치본이 내 components 를 결재해 마운트하면 그 허브 아래로
# 접힌다 · always: 늘 최상위 · never: 목록에 안 선다(콘솔 상세·직접 주소로는 닿는다)
shell:
  nav: auto

surfaces:
  view:
    source: surfaces/view
    out: out
  components:                # 컴포넌트 수출 — 다른 패키지 화면이 마운트하는 자립 ESM(+선택 CSS).
    source: surfaces/components   # 계약은 index.js 의 mount(el, props) 수출 하나. React 로 저작하면 번들 안에 들어간다
    out: dist                     # out 미선언이면 source/index.js 를 그대로 서빙(빌드 없는 손저작)
  channels:
    - name: discord
      source: channels/discord
      entry: index.ts
    - name: slack
      source: channels/slack
      entry: index.ts

harness:
  # variants 는 **동봉**이다 — 미선언이면 기판 풀 전체가 후보다(어댑터는 콘솔 패키지가 동봉하고
  # 기판이 홈 하위로 펴서 모든 앱이 공유한다). 여기 적는 것은 "풀에 없는 하네스를 데려온다"
  # 이거나 "이 하네스로 시험했다" 이지, "나머지를 금한다" 가 아니다 — 금지는 requires 다
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      # 계약 선언 — 적합성 판정(relay harness-check)이 어댑터 info 의 답과 대조한다.
      # 이 선언이 있어야 기판이 **스폰 없이** requires 로 후보를 거를 수 있다
      protocol: 3
      capabilities: [cancel, vision, resume, ask, tasks, steer]
      llm:
        provider: anthropic
        # env = 무인(org) 기판이 자격을 댈 이름 — 1인 기판은 이음새가 비어 도구 자신의 로그인이 답
        auth: { kind: oauth, env: CLAUDE_CODE_OAUTH_TOKEN }
    - name: codex
      source: harness/codex
      entry: run
      protocol: 2
      capabilities: [cancel, vision, resume]
      llm:
        provider: openai
        auth: { kind: oauth }
  # 이 앱이 성립하려면 하네스가 가져야 하는 능력. **이름이 아니라 능력으로 잠근다** — 이름으로
  # 잠그면 잠근 이유가 선언에 남지 않고, 다른 하네스가 같은 능력을 구현해도 열리지 않는다.
  # 만족하는 후보가 하나도 없으면 세션이 사유를 말하고 서지 않는다(조용한 강등 금지)
  requires: [cancel, resume]
  # 기본 선택 — 잠금이 아니라 선호라 사용자가 바꾼다. "없으면 안 돈다" 는 requires 쪽이다
  prefers: claude-code
  # 저자가 실제로 돌려본 것. 화면이 나머지를 "미검증" 으로 표시한다 — 막지는 않는다
  verified: [claude-code]
  workdir: work/

agents:
  - name: orders
    default: true            # main 슬롯 착지점 (최대 1) — 미선언이면 "짧은 이름과 같은 에이전트" 관례
    persona: agents/orders/AGENT.md
    greeting: "무엇을 도와드릴까요?"   # 빈 대화의 첫 줄. 창구가 아니라 말하는 쪽 소속이다
    skills: agents/orders/skills
    commands: agents/orders/commands
    dispatch: [worker]
  - name: worker
    persona: agents/worker/AGENT.md
    scripts: [orders-*, report-weekly]

scripts:
  source: scripts
  # GET 으로도 열리는 동사 — 인가 리다이렉트·웹훅 검증처럼 GET 으로 오는 호출의 자리다.
  # 질의 문자열이 그대로 입력이 되고, 답이 문자열이면 본문 그대로 나간다(검증 챌린지)
  get: [webhook-verify]

services:
  - name: sessions
    source: services/sessions
    dockerfile: Dockerfile
    disk: 1Gi
    resources: { memory: 512Mi, cpu: 0.5 }
    port: 8080
  - name: browser
    source: services/browser
    dockerfile: Dockerfile
    port: 9222
  - name: erp-events
    source: services/erp-events
    entry: index.ts
    port: 8090
  # dir = 기판이 세우는 파일 문. 이름이 정본이고 경로는 로컬 기본 바인딩이다(설치 결재가 갈아
  # 끼운다). 동사는 ctx.service("inbox").call("read", { path }) 로 쓰고, 세션은 그 동사로만 닿는다 —
  # 폴더 도구도 절대경로도 세션에는 나가지 않는다
  - name: inbox
    dir: ~/Documents/orders-inbox
  - name: erp
    url: https://erp.internal.example.com/mcp
    tools: [list-orders, get-order, create-draft-order]
    auth:
      kind: token
      env: ERP_TOKEN
      help:
        url: "https://erp.internal.example.com/settings/tokens"
        note: "본인 계정으로 API 토큰을 발급해 붙여넣으세요."
      verify:
        url: "https://erp.internal.example.com/api/me"
  # api 형 + 입력 칸. 칸 어휘는 채널 credential.fields 와 같고, header 칸 하나만 Authorization 으로
  # 나간다(scheme 이 접두). required: false = 없어도 돌고 그 기능만 꺼진다 — 연결 화면이 "선택" 으로
  # 세우고 help.note 가 무엇이 켜지는지 말한다. 동사는 ctx.service("photos").connected() 로 묻고,
  # 비밀 아닌 칸(app_id)은 ctx.service("photos").fields() 로 읽는다
  - name: photos
    api: https://api.unsplash.com
    auth:
      kind: token
      scheme: Client-ID
      required: false
      fields:
        - { key: access_key, label: Access Key, header: true }
        - { key: app_id, label: Application ID }
      help:
        url: "https://unsplash.com/oauth/applications"
        note: "없어도 무료 저장소로 동작합니다 — 연결하면 Unsplash 사진 검색이 켜집니다."
      verify:
        url: "https://api.unsplash.com/photos?per_page=1"
  - name: drive
    url: https://drive-mcp.example.com/mcp
    tools: [search, fetch]
    auth:
      kind: oauth
      client: registered
      oauth_client:
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
        auth_meta:
          authorization_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"
          token_endpoint: "https://oauth2.googleapis.com/token"
          authorize_params: { access_type: "offline", prompt: "consent" }
  # 계정이 여럿인 바깥 서비스. accounts: true 면 자격이 계정마다 하나씩 앉고(vault <패키지>/<서비스>@<계정>)
  # 동사는 ctx.service("social").accounts() 로 열거해 .account(<계정>) 으로 고른다. 인가가 주지 않는
  # 부속 값(계정 번호)은 oauth 형에도 fields 로 받고, 자격은 헤더가 아니라 질의 파라미터로 나간다
  # (inject). 토큰 교환이 다른 호스트에 살아 bases 로 그 접두를 함께 선언한다 — 자격이 닿는 곳은 전부 고지된다
  - name: social
    api: https://graph.social.example.com
    bases: ["https://api.social.example.com"]
    auth:
      kind: oauth
      client: registered
      inject: { query: access_token }
      accounts: true
      oauth_client:
        client_id: "1234567890"        # 공개 식별자 — 비밀이 아니라 트리에 산다. 사람이 넣을 것은 client_secret 뿐
        https: true                    # 콜백에 HTTPS 를 요구한다 — 기판의 TLS 문(RELAY_TLS_PORT)이 없으면 흐름이 서지 않는다
        scopes: ["business_basic", "business_content_publish"]
        auth_meta:
          authorization_endpoint: "https://www.social.example.com/oauth/authorize"
          token_endpoint: "https://api.social.example.com/oauth/access_token"
          exchange_endpoint: "https://graph.social.example.com/access_token"   # 단기 → 장기 교환(제공자 방언)
          exchange_params: { grant_type: "ig_exchange_token" }
          refresh_endpoint: "https://graph.social.example.com/refresh_access_token"
          refresh_params: { grant_type: "ig_refresh_token" }
      fields:
        - { key: user_id, label: 계정 번호 }
      help:
        note: "로그인하면 이 계정으로 발행이 켜집니다."
  # api = REST 베이스. 기판이 몸을 띄우지 않는 것은 url 형과 같고, 문의 말이 MCP 가 아닌 것만
  # 다르다. 동사는 ctx.service("shipping").fetch("/v1/labels", {…}) 로 부르고 자격은 손에 쥐지
  # 않는다 — 기판이 호출마다 붙이고, 요청은 이 base 접두 밖으로 나가지 못한다.
  # 몸 없는 커넥터 패키지는 이 선언 하나가 계약의 전부다
  - name: shipping
    api: https://api.shipping.example.com
    auth:
      kind: token
      # Authorization 접두는 미선언이면 Bearer 다. Client-ID 처럼 다른 접두를 요구하는 API 는
      # scheme: Client-ID 로 선언한다 — 동사는 자격을 쥐지 않으므로 조립은 여기서만 정해진다
      help:
        url: "https://api.shipping.example.com/settings/tokens"
        note: "본인 계정으로 API 토큰을 발급해 붙여넣으세요."
      verify:
        url: "https://api.shipping.example.com/v1/me"

triggers:
  - id: daily-digest
    label: "아침 요약"
    when: { cron: "0 9 * * *", tz: "Asia/Seoul" }
    # delivery = 선톡 좌표 <채널이름>:<대화키> — 턴이 그 대화의 slot 에서 돌고 reply 가 채널로 발신된다
    then: { agent: orders, prompt: "어제 처리량을 요약해 주세요.", delivery: "discord:orders-daily" }
  - id: on-install
    when: { event: relay.package.installed, debounce_ms: 60000 }
    then: { agent: orders, prompt: "설치 직후 초기 설정 상태를 점검해 주세요.", route: "/orders" }
  - id: nightly-sync
    when: { cron: "0 3 * * *", tz: "Asia/Seoul" }
    then: { script: orders-sync }

missions:
  - name: product-context
    description: "제품 맥락(제품명, 포지셔닝, 핵심 기능, 타깃)을 질의에 답한다."

edges:
  - provider: "@relay/notion@^1"
    tools: [search, fetch]
    agent_access: full         # search·fetch 가 notion 의 동사가 아니라 그 패키지가 services[].url.tools 에
                               # 선언한 원격 MCP 도구라면 이 줄이 있어야 세션에 raw 로 선다(기본 scripts-only)
  - provider: "@local/devteam"
    mission: product-context
  - provider: "@local/ui@^1"   # components 소비 — 기판이 화면에 import map 을 심는다
    components: true           # 화면 코드: import { mount } from "@local/ui"  (주소를 조립하지 않는다)

org:
  per_user:
    # 어휘 하나 — url·api·dir 서비스 이름, 또는 edge provider 좌표
    accounts: [erp, drive, shipping, "@relay/notion"]
    replicas: [browser]
