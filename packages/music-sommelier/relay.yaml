schema: relay/v1
name: "@local/music-sommelier"
version: 0.1.0
display_name: "음악 소믈리에"
description: "기분, 상황, 장르, 좋아하는 아티스트를 바탕으로 곡과 플레이리스트를 추천하는 대화형 에이전트."
icon: assets/icon.svg

surfaces:
  chat:
    mode: direct
    greeting: "지금 기분이나 상황, 좋아하는 장르나 아티스트를 알려주시면 어울리는 곡을 골라 드릴게요."

harness:
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      llm:
        provider: anthropic
        auth: { kind: oauth }

agents:
  - name: music-sommelier
    persona: agents/music-sommelier/AGENT.md
