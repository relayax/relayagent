schema: relay/v1
name: "@relay/system"
version: 0.2.2
display_name: "Relay"
description: "기판 관리 셸. 패키지 목록, mcp/a2a 그래프, 연결 결재, surface 호스팅, 저작 스튜디오."

# 수정 레이어(draft 이력·diff·릴리스 태그)가 git 을 쓴다
requires:
  # AND 다 — 설치가 끝나면 전부 실재한다. 레시피(manager+package) 있는 항목은 호스트에 없으면
  # 기판이 ~/.relay/bin/system/ 에 깔아 이 패키지의 스폰에 PATH 앞으로 준다. git 은 기판이
  # 깔아줄 수 없어 안내만 싣는다. kimi(uv)는 요구하지 않는다 — uv 를 제품 전제로 만들지 않기
  # 위해서다. kimi 변형은 호스트에 있으면 후보가 되는 선택 표면으로 남는다.
  binaries:
    - name: git
      install: "xcode-select --install (macOS) 또는 https://git-scm.com"
    - name: claude
      manager: npm
      package: "@anthropic-ai/claude-code"
    - name: codex
      manager: npm
      package: "@openai/codex"
    # 어댑터(harness/pi)는 pi | pi-pods 둘 다 받지만, 이 레시피가 실제로 까는 실행 파일은
    # pi-pods 다 — 선언은 실체를 적는다(설치후 검증이 이 이름으로 실재를 판정한다)
    - name: pi-pods
      manager: npm
      package: "@mariozechner/pi"

surfaces:
  view:
    source: surfaces/view
    out: out
  channels:
    # 참조 어댑터(의존성 0 — 네이티브 WebSocket/fetch). 자격을 연결하지 않으면 스폰 즉시
    # 안내를 남기고 조용히 물러난다. credential 선언이 화면의 입력 칸을 그린다 — 없으면
    # 사람이 JSON 을 손으로 조립해야 했다. 게이트(allow)는 자격에 같이 산다: 기본 닫힘이라
    # 이 값이 없으면 아무도 통과하지 못하는데, 데몬 env 로만 열 수 있으면 화면에서 열 길이 없다.
    - name: discord
      source: channels/discord
      entry: index.ts
      credential:
        fields:
          - key: bot
            label: 봇 토큰
            placeholder: "MTA…"
            secret: true
            required: true
          - key: allow
            label: 허용 사용자 ID
            placeholder: "123456789012345678, 234567890123456789"
            list: true
            required: true
        help:
          url: https://discord.com/developers/applications
          note: 애플리케이션 → Bot 에서 토큰을 발급하고 MESSAGE CONTENT INTENT 를 켜세요. 사용자 ID 는 개발자 모드를 켠 뒤 사용자 우클릭 → ID 복사.
    - name: slack
      source: channels/slack
      entry: index.ts
      credential:
        fields:
          - key: app
            label: 앱 레벨 토큰 (Socket Mode)
            placeholder: "xapp-…"
            secret: true
            required: true
          - key: bot
            label: 봇 토큰
            placeholder: "xoxb-…"
            secret: true
            required: true
          - key: allow
            label: 허용 사용자 ID
            placeholder: "U01ABCDEFGH, U02IJKLMNOP"
            list: true
            required: true
        help:
          url: https://api.slack.com/apps
          note: Socket Mode 를 켜고 앱 레벨 토큰(xapp-)을 만든 뒤, OAuth & Permissions 에서 봇 토큰(xoxb-)을 설치하세요. 사용자 ID 는 프로필 → 더보기 → 멤버 ID 복사.

harness:
  # binary = requires.binaries 참조. 레시피는 requires 한 곳에 산다 — setup 실패 시 기판이
  # 그 레시피로 사본을 깔고 재시도한다(껍데기 npm 래퍼 회복 경로). 버전은 고정하지 않는다:
  # CLI 어휘가 빠르게 움직여서(models 별칭·--effort 도입) 고정하면 낡은 판에 묶인다.
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      binary: claude
      icon: harness/claude-code/icon.png
      llm:
        provider: anthropic
        icon: assets/llm/anthropic.svg
        # env = 무인 기판이 자격을 댈 이름(선언이 먼저). 1인 기판은 이음새가 null 이라
        # 도구 자신의 로그인이 그대로 답이다. API 키 기판은 ANTHROPIC_API_KEY 를 배치 env 로.
        auth: { kind: oauth, env: CLAUDE_CODE_OAUTH_TOKEN }
    - name: codex
      source: harness/codex
      entry: run
      binary: codex
      icon: harness/codex/icon.png
      llm:
        provider: openai
        icon: assets/llm/openai.svg
        auth: { kind: oauth, env: OPENAI_API_KEY }
    - name: pi
      source: harness/pi
      entry: run
      binary: pi-pods
      llm:
        provider: vllm
        icon: assets/llm/vllm.svg
        auth: { kind: token, env: PI_API_KEY }
    - name: kimi
      source: harness/kimi
      entry: run
      icon: harness/kimi/icon.png
      llm:
        provider: moonshot
        icon: assets/llm/moonshot.svg
        auth: { kind: token, env: MOONSHOT_API_KEY }

agents:
  - name: system
    persona: agents/system/AGENT.md
    greeting: "설치된 앱과 연결 상태를 묻거나, 새 에이전트를 만들어 보세요. 만들기는 빌더가 별도 대화에서 진행하고, 그 대화 탭이 자동으로 열립니다."
    commands: agents/system/commands
    dispatch: [agent-builder]
  - name: agent-builder
    persona: agents/agent-builder/AGENT.md
    # 스튜디오의 대화가 이 에이전트에 직접 붙는다 — 인사말이 없으면 빈 창으로 열려 무엇을 말해야
    # 할지 힌트가 없다. 예시 세 줄이 곧 이 대화의 사용 설명이다
    greeting: "이 패키지를 말로 고칠 수 있습니다. 예를 들어 \"저녁 8시에 하루 정리를 물어보게 해줘\", \"저장 버튼을 목록 위로 올려줘\", \"노션이랑 연결해줘\" 처럼 말해 보세요. 고친 것은 왼쪽 목록과 오른쪽 미리보기에 바로 반영됩니다."
    skills: agents/agent-builder/skills
    scripts: [pkg-*, grant-*, draft-*, release-*]

scripts:
  source: scripts

