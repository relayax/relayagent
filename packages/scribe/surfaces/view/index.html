<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7f5;
    --bg-elev: #ffffff;
    --border: #e8e8e6;
    --border-strong: #d8d8d4;
    --text: #37352f;
    --text-soft: #6b6a63;
    --text-faint: #9b9a93;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --code-bg: #f2f1ee;
    --code-text: #b8432a;
    --quote-bar: #d8d8d4;
    --sel: #d9e6ff;
    --shadow: 0 8px 28px rgba(15, 15, 15, 0.12);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --bg-soft: #202020;
    --bg-elev: #262626;
    --border: #2f2f2f;
    --border-strong: #3a3a3a;
    --text: #e9e8e3;
    --text-soft: #9d9c97;
    --text-faint: #6f6e69;
    --accent: #5b8cff;
    --accent-soft: #22304d;
    --code-bg: #2a2a2a;
    --code-text: #ff9d7a;
    --quote-bar: #3a3a3a;
    --sel: #29406b;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  ::selection { background: var(--sel); }

  /* ---- top bar ---- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .brand svg { width: 20px; height: 20px; color: var(--accent); }
  .doc-title {
    border: none; background: transparent; color: var(--text);
    font-size: 15px; font-weight: 500; font-family: var(--sans);
    padding: 4px 6px; border-radius: 6px; min-width: 120px; max-width: 320px; flex: 1 1 auto;
  }
  .doc-title:focus { outline: none; background: var(--bg-soft); }
  .spacer { flex: 1 1 auto; }
  .status { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .seg { display: inline-flex; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; background: transparent; color: var(--text-soft);
    padding: 5px 10px; font-size: 12.5px; cursor: pointer; font-family: var(--sans);
  }
  .seg button.active { background: var(--bg-elev); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .icon-btn {
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text-soft);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; font-size: 15px;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

  /* ---- toolbar ---- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
    padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-elev); flex: 0 0 auto;
  }
  .toolbar button {
    border: none; background: transparent; color: var(--text-soft);
    min-width: 30px; height: 28px; padding: 0 7px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-family: var(--sans); display: inline-flex; align-items: center; justify-content: center;
  }
  .toolbar button:hover { background: var(--bg-soft); color: var(--text); }
  .toolbar button b { font-weight: 700; }
  .toolbar button i { font-style: italic; }
  .toolbar button s { text-decoration: line-through; }
  .toolbar .div { width: 1px; height: 18px; background: var(--border); margin: 0 5px; }
  .hint { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }
  .hint kbd {
    font-family: var(--mono); font-size: 10.5px; background: var(--bg-soft);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px;
  }

  /* ---- docs sidebar ---- */
  .docs { flex: 0 0 210px; border-right: 1px solid var(--border); background: var(--bg-soft); display: flex; flex-direction: column; min-width: 0; }
  .docs-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; font-size: 12px; font-weight: 600; color: var(--text-soft); }
  .docs-head button { border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-soft); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; cursor: pointer; font-family: var(--sans); }
  .docs-head button:hover { color: var(--text); }
  .docs-list { flex: 1 1 auto; overflow-y: auto; padding: 0 6px 6px; }
  .doc-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text); }
  .doc-item:hover { background: var(--bg-elev); }
  .doc-item.on { background: var(--accent-soft); }
  .doc-item span { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-item button { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 12px; visibility: hidden; padding: 2px; }
  .doc-item:hover button { visibility: visible; }
  .doc-item button:hover { color: var(--code-text); }
  .docs-empty { padding: 10px 12px; font-size: 12px; color: var(--text-faint); }
  .docs-foot { padding: 8px 12px; font-size: 11px; color: var(--text-faint); border-top: 1px solid var(--border); }

  /* ---- main split ---- */
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane { flex: 1 1 50%; min-width: 0; overflow: auto; }
  .pane.editor { border-right: 1px solid var(--border); }
  body[data-mode="editor"] .pane.preview { display: none; }
  body[data-mode="editor"] .pane.editor { flex-basis: 100%; border-right: none; }
  body[data-mode="preview"] .pane.editor { display: none; }
  body[data-mode="preview"] .pane.preview { flex-basis: 100%; }

  #editor {
    width: 100%; height: 100%; min-height: 100%; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; line-height: 1.7;
    padding: 28px max(28px, 4%); tab-size: 2;
  }
  #editor::placeholder { color: var(--text-faint); }

  .preview-inner { padding: 28px max(28px, 6%); max-width: 820px; margin: 0 auto; }
  .preview-inner > :first-child { margin-top: 0; }
  .preview-inner h1 { font-size: 1.9em; font-weight: 700; margin: 0.7em 0 0.35em; line-height: 1.25; }
  .preview-inner h2 { font-size: 1.5em; font-weight: 650; margin: 0.9em 0 0.35em; line-height: 1.3; }
  .preview-inner h3 { font-size: 1.25em; font-weight: 600; margin: 0.9em 0 0.3em; }
  .preview-inner h4 { font-size: 1.08em; font-weight: 600; margin: 0.9em 0 0.3em; }
  .preview-inner h5, .preview-inner h6 { font-size: 1em; font-weight: 600; margin: 0.8em 0 0.3em; color: var(--text-soft); }
  .preview-inner p { margin: 0.55em 0; line-height: 1.75; }
  .preview-inner a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .preview-inner a:hover { border-bottom-color: var(--accent); }
  .preview-inner strong { font-weight: 700; }
  .preview-inner em { font-style: italic; }
  .preview-inner del { color: var(--text-faint); }
  .preview-inner code {
    font-family: var(--mono); font-size: 0.88em; background: var(--code-bg);
    color: var(--code-text); padding: 0.15em 0.4em; border-radius: 5px;
  }
  .preview-inner pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; margin: 0.8em 0;
  }
  .preview-inner pre code { background: none; color: var(--text); padding: 0; font-size: 0.85em; line-height: 1.6; }
  .preview-inner ul, .preview-inner ol { margin: 0.5em 0; padding-left: 1.5em; }
  .preview-inner li { margin: 0.2em 0; line-height: 1.7; }
  .preview-inner li.task { list-style: none; margin-left: -1.4em; display: flex; align-items: flex-start; gap: 8px; }
  .preview-inner li.task input { margin-top: 5px; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex: 0 0 auto; }
  .preview-inner li.task .task-done { color: var(--text-faint); text-decoration: line-through; }
  .preview-inner blockquote {
    margin: 0.7em 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--quote-bar); color: var(--text-soft);
  }
  .preview-inner blockquote p { margin: 0.25em 0; }
  .preview-inner hr { border: none; border-top: 1px solid var(--border-strong); margin: 1.4em 0; }
  .preview-inner table { border-collapse: collapse; margin: 0.8em 0; display: block; overflow-x: auto; }
  .preview-inner th, .preview-inner td { border: 1px solid var(--border); padding: 6px 12px; }
  .preview-inner th { background: var(--bg-soft); }
  .empty-hint { color: var(--text-faint); font-style: italic; }

  /* ---- slash menu ---- */
  .slash {
    position: fixed; z-index: 50; background: var(--bg-elev); border: 1px solid var(--border-strong);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px; width: 268px; max-height: 320px; overflow-y: auto;
    display: none;
  }
  .slash.open { display: block; }
  .slash .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 6px 10px 3px; }
  .slash .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .slash .item .ic {
    width: 30px; height: 30px; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 7px;
    display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-soft); background: var(--bg);
  }
  .slash .item .tx { display: flex; flex-direction: column; line-height: 1.25; }
  .slash .item .tx b { font-weight: 550; font-size: 13.5px; }
  .slash .item .tx span { font-size: 11.5px; color: var(--text-faint); }
  .slash .item.sel { background: var(--accent-soft); }
  .slash .item.sel .ic { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 720px) {
    body[data-mode="split"] .pane.preview { display: none; }
    body[data-mode="split"] .pane.editor { flex-basis: 100%; border-right: none; }
    .hint { display: none; }
    .brand span { display: none; }
  }
</style>
</head>
<body data-mode="split">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>Scribe</span>
    </div>
    <input class="doc-title" id="docTitle" value="제목 없는 문서" spellcheck="false" aria-label="문서 제목">
    <div class="spacer"></div>
    <span class="status" id="status">저장됨</span>
    <div class="seg" role="tablist" aria-label="보기 모드">
      <button data-mode="editor" title="편집기만">편집</button>
      <button data-mode="split" class="active" title="편집 + 미리보기">분할</button>
      <button data-mode="preview" title="미리보기만">미리보기</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◑</button>
  </header>

  <div class="toolbar" id="toolbar">
    <button data-cmd="h1" title="제목 1 (Ctrl/Cmd+Alt+1)">H1</button>
    <button data-cmd="h2" title="제목 2 (Ctrl/Cmd+Alt+2)">H2</button>
    <button data-cmd="h3" title="제목 3 (Ctrl/Cmd+Alt+3)">H3</button>
    <span class="div"></span>
    <button data-cmd="bold" title="굵게 (Ctrl/Cmd+B)"><b>B</b></button>
    <button data-cmd="italic" title="기울임 (Ctrl/Cmd+I)"><i>I</i></button>
    <button data-cmd="strike" title="취소선"><s>S</s></button>
    <button data-cmd="code" title="인라인 코드 (Ctrl/Cmd+E)">&lt;/&gt;</button>
    <button data-cmd="link" title="링크 (Ctrl/Cmd+K)">🔗</button>
    <span class="div"></span>
    <button data-cmd="ul" title="글머리 목록">• 목록</button>
    <button data-cmd="ol" title="번호 목록">1. 목록</button>
    <button data-cmd="todo" title="체크박스">☑ 할일</button>
    <button data-cmd="quote" title="인용">❝ 인용</button>
    <button data-cmd="codeblock" title="코드 블록">▤ 코드</button>
    <button data-cmd="hr" title="구분선">─ 선</button>
    <span class="hint"><kbd>/</kbd> 로 블록 삽입</span>
  </div>

  <main>
    <aside class="docs">
      <div class="docs-head"><span>문서</span><button id="newDoc" title="새 문서 만들기">+ 새 문서</button></div>
      <div class="docs-list" id="docsList"><div class="docs-empty">불러오는 중...</div></div>
      <div class="docs-foot">~/Relay/scribe 폴더에 파일로 저장됩니다</div>
    </aside>
    <div class="pane editor">
      <textarea id="editor" spellcheck="false" placeholder="여기에 입력하세요. 새 줄에서 '/' 를 누르면 블록 메뉴가 열립니다."></textarea>
    </div>
    <div class="pane preview">
      <div class="preview-inner" id="preview"></div>
    </div>
  </main>

  <div class="slash" id="slash"></div>

<script>
(function () {
  "use strict";
  var editor = document.getElementById("editor");
  var preview = document.getElementById("preview");
  var slashEl = document.getElementById("slash");
  var statusEl = document.getElementById("status");
  var docTitle = document.getElementById("docTitle");
  var KEY = "scribe.doc.v1";

  /* ============ markdown renderer (self-contained, no deps) ============ */
  var CB = []; // maps rendered checkbox index -> source line number

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function parseInline(text) {
    var s = escapeHtml(text);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return "␀" + (codes.length - 1) + "␀"; });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, u) { return '<img alt="' + alt + '" src="' + u + '" style="max-width:100%">'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/␀(\d+)␀/g, function (m, i) { return "<code>" + codes[i] + "</code>"; });
    return s;
  }

  function isBlockStart(line) {
    return /^```/.test(line) ||
      /^(#{1,6})\s+/.test(line) ||
      /^\s*(---|\*\*\*|___)\s*$/.test(line) ||
      /^\s*>\s?/.test(line) ||
      /^\s*([-*+]|\d+\.)\s+/.test(line) ||
      /^\s*\|.*\|\s*$/.test(line);
  }

  function buildList(items, cbMap) {
    if (!items.length) return "";
    var level = items[0].indent;
    var ordered = items[0].ordered;
    var html = ordered ? "<ol>" : "<ul>";
    var i = 0;
    while (i < items.length) {
      var it = items[i];
      var j = i + 1;
      while (j < items.length && items[j].indent > level) j++;
      var children = items.slice(i + 1, j);
      html += "<li" + (it.checkbox !== null ? ' class="task"' : "") + ">";
      if (it.checkbox !== null) {
        var idx = cbMap.length;
        cbMap.push(it.line);
        html += '<input type="checkbox" data-cb="' + idx + '"' + (it.checkbox ? " checked" : "") + ">";
        html += '<span class="' + (it.checkbox ? "task-done" : "") + '">' + parseInline(it.content) + "</span>";
      } else {
        html += parseInline(it.content);
      }
      if (children.length) html += buildList(children, cbMap);
      html += "</li>";
      i = j;
    }
    html += ordered ? "</ol>" : "</ul>";
    return html;
  }

  function parseTable(lines, start) {
    // requires a header row, a separator row (---|---), then body rows
    if (start + 1 >= lines.length) return null;
    if (!/^\s*\|?\s*:?-{2,}.*\|/.test(lines[start + 1]) && !/^\s*:?-{2,}\s*(\|\s*:?-{2,}\s*)+\|?\s*$/.test(lines[start + 1])) {
      if (!/-{2,}/.test(lines[start + 1]) || lines[start + 1].indexOf("|") === -1) return null;
    }
    function cells(row) {
      return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
    }
    var head = cells(lines[start]);
    var i = start + 2;
    var body = [];
    while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
      body.push(cells(lines[i]));
      i++;
    }
    var html = "<table><thead><tr>";
    head.forEach(function (h) { html += "<th>" + parseInline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      head.forEach(function (_, ci) { html += "<td>" + parseInline(r[ci] || "") + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table>";
    return { html: html, next: i };
  }

  function renderBlocks(src) {
    var lines = src.split("\n");
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push("<h" + h[1].length + ">" + parseInline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        var qb = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { qb.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + renderBlocks(qb.join("\n")) + "</blockquote>");
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        var t = parseTable(lines, i);
        if (t) { out.push(t.html); i = t.next; continue; }
      }
      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        var items = [];
        while (i < lines.length) {
          var m = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          if (!m) break;
          var indent = m[1].replace(/\t/g, "  ").length;
          var ordered = /\d+\./.test(m[2]);
          var content = m[3];
          var checkbox = null;
          var cbm = content.match(/^\[([ xX])\]\s+(.*)$/);
          if (cbm) { checkbox = cbm[1].toLowerCase() === "x"; content = cbm[2]; }
          items.push({ indent: indent, ordered: ordered, content: content, checkbox: checkbox, line: i });
          i++;
        }
        out.push(buildList(items, CB));
        continue;
      }
      var pb = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) { pb.push(lines[i]); i++; }
      out.push("<p>" + pb.map(parseInline).join("<br>") + "</p>");
    }
    return out.join("\n");
  }

  function renderMarkdown(src) {
    CB = [];
    if (!src.trim()) return '<p class="empty-hint">여기에 미리보기가 표시됩니다.</p>';
    return renderBlocks(src);
  }

  /* ============ persistence + render loop ============ */
  /* 문서의 거처는 컴퓨터 폴더(~/Relay/scribe)다. 기판 동사(doc-save 등)로 .md 파일을
     읽고 쓴다. localStorage 는 서버가 안 닿을 때의 임시 초안 백업일 뿐이다. */
  var PKG = (location.pathname.match(/^\/pkg\/([^/]+)\//) || [null, "scribe"])[1];
  var docsList = document.getElementById("docsList");
  var currentName = null; // 폴더에 앉은 파일 이름 (null = 아직 저장 전)

  function api(name, input) {
    return fetch("/pkg/" + PKG + "/script/" + name, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ input: input || {} })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || "HTTP " + r.status);
        return j.result;
      });
    });
  }

  var saveTimer = null;

    // 서버가 안 닿으면 이전처럼 브라우저 초안으로라도 연다
    docsList.innerHTML = '<div class="docs-empty">폴더를 읽지 못했습니다</div>';
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved && typeof saved.body === "string") {
        editor.value = saved.body;
        if (saved.title) docTitle.value = saved.title;
      } else { editor.value = SAMPLE; }
    } catch (e) { editor.value = SAMPLE; }
    render();
  });

  try {
    var savedMode = localStorage.getItem("scribe.mode");
    if (savedMode) {
      document.body.setAttribute("data-mode", savedMode);
      document.querySelectorAll(".seg button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-mode") === savedMode); });
    }
  } catch (e) {}

  render();
})();
</script>
</body>
</html>
