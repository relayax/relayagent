$schema: "https://json-schema.org/draft/2020-12/schema"
$id: relay/v1
title: relay.yaml
description: |
  에이전트 패키지 매니페스트 = 패키지의 BOM. 패키지 = 디렉토리 하나. relay.yaml 이 구조와
  경로의 정본, 트리가 내용의 정본. 기판은 여기 선언된 경로 밖의 파일을 읽지 않고,
  선언-실체 불일치는 설치 fail-loud. 관례 배치 (경로는 전부 relay.yaml 선언값):
    relay.yaml
    assets/icon.svg                  icon
    agents/<name>/AGENT.md           agents[].persona. 스킬 = agents[].skills/<skill>/SKILL.md
    scripts/<이름>.ts                scripts.source 아래 동사. 기본 수출 async 함수 (input, ctx) => 결과 JSON (+ 선택 meta 수출)
    surfaces/view/                   surfaces.view.source (+ out 선언 시 발행이 빌드해 <source>/<out> 서빙)
    surfaces/components/             surfaces.components.source (+ out 선언 시 발행이 굽는다) — 다른 패키지 화면이 마운트하는 자립 번들
    channels/<name>/                 channels[].source + entry
    harness/<name>/                  harness.variants[].source + entry
    services/<name>/                 services[].source + dockerfile(컨테이너 형) 또는 entry(프로세스 형)
type: object
additionalProperties: false
required: [schema, name, version, display_name, description]
properties:
  schema:
    const: relay/v1
  name:
    type: string
    pattern: '^@[a-z0-9-]+/[a-z0-9][a-z0-9-]{1,39}$'
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
  display_name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  icon:
    type: string
  publisher:
    description: 발행 주체 좌표 (@scope). 스토어 리스팅·정산이 읽는다 — 개인 기판은 표시 외 소비 없음
    type: string
    pattern: '^@[a-z0-9-]+$'
  released_at:
    description: 발행일 YYYY-MM-DD. 스토어 리스팅 메타 — 개인 기판은 표시 외 소비 없음
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  changelog:
    description: 판 변경 기록(마크다운) — 스토어 리스팅·업그레이드 화면 메타. 저작은 보통 CHANGELOG.md 를 발행이 합성한다
    type: string
    minLength: 1
  requires:
    description: |
      호스트 환경 요구 = 설치 관문. validate 는 형태만 판정하고, 설치가 실체를 판정해
      미충족이면 fail-loud. 기판은 안내(install)만 전하고 대신 설치하지 않는다.
      os 는 process.platform 값, binaries 는 PATH 에서, apps 는 /Applications 계열에서 찾는다.
    type: object
    additionalProperties: false
    properties:
      os:
        description: 지원 OS 닫힌집합. 미선언 = 모든 OS
        type: array
        minItems: 1
        items:
          enum: [darwin, linux, win32]
      binaries:
        description: |
          있어야 하는 실행 파일. requires 는 AND 다 — 설치가 끝나면 목록 전부가 실재한다.
          install 만 있으면 종전대로 안내와 함께 거부한다(git 처럼 기판이 깔아줄 수 없는 것).
          manager+package 는 **기판이 직접 채우는 레시피**다: 없으면 기판이
          ~/.relay/bin/<패키지>/ 에 깔아 그 패키지의 스폰에 PATH 앞으로 준다 — 호스트 전역
          설치가 없거나 깨져 있어도 패키지가 돈다. 이 레시피가 있어야 하네스 도구를 requires 에
          올릴 수 있다(없던 시절에는 codex 를 요구하면 claude 만 쓰는 사용자의 설치가 막혔다).
          manager 는 닫힌집합이다 — 매니페스트가 셸 문자열을 실행시키지 못한다. 매니저 자체가
          없는 환경은 설치가 fail-loud 한다(install 안내가 있으면 함께 싣는다).
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
            install:
              description: 미충족 판정문에 실리는 설치 안내 (명령 또는 URL)
              type: string
              minLength: 1
            manager:
              description: 기판이 채울 때 쓰는 패키지 매니저 — package 와 함께만
              enum: [npm, uv]
            package:
              description: 매니저의 패키지 좌표 — manager 와 함께만
              type: string
              minLength: 1
            version:
              description: 고정 버전. 지정하면 호스트에 무엇이 있든 기판 사본이 정본(재현성 요구)
              type: string
              minLength: 1
      apps:
        description: 데스크톱 앱 번들. darwin 전용 — 선언 시 os 는 [darwin]
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              description: '.app 확장자를 뺀 번들 이름 (예: Slack, Google Chrome)'
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$'
              not:
                pattern: '\.app$'
            install:
              type: string
              minLength: 1
    if:
      required: [apps]
    then:
      required: [os]
      properties:
        os:
          items:
            const: darwin
  surfaces:
    description: |
      패키지가 세상에 내미는 창구들. 전부 저작물이 사는 경로 선언이다 — 선언 없는 창구는 없다.
      선택 블록이다: 트리거·채널로만 도는 패키지, 몸 없는 커넥터는 창구가 없을 수 있다.
      "사람이 직접 대화할 수 있는가" 는 여기가 아니라 agents[] 가 답한다 — 에이전트가 있고
      view 가 없으면 기판이 /pkg/<이름>/view/ 에 전체 화면 대화를 세운다(선언 아닌 도출).
    type: object
    additionalProperties: false
    properties:
      view:
        description: 화면 소스. out 미선언 = source 정적 서빙, out 선언 = 발행이 빌드 후 <source>/<out> 서빙
        type: object
        additionalProperties: false
        required: [source]
        properties:
          source:
            $ref: '#/$defs/relpath'
          out:
            description: |
              빌드 산출 디렉토리. 선언하면 설치가 <source> 에서 npm install(최초) + npm run build 를 돌린다.
              화면은 /pkg/<설치이름>/view/ 아래로 서빙되고 설치 이름은 설치 시점에 정해지므로,
              기판이 그 접두사를 RELAY_BASE_PATH 로 주입한다. 프레임워크의 basePath 를 여기에 맞춰라
              (Next.js: basePath: process.env.RELAY_BASE_PATH). 재빌드는 relay build <패키지>
            $ref: '#/$defs/relpath'
      components:
        description: |
          컴포넌트 수출 — 다른 패키지의 화면이 마운트하는 **자립 번들**. 소비는 빌드가 아니라
          런타임이다: 기판이 번들을 주소로 서빙하고, 소비자 문서에 import map 을 심어 제공자
          매니페스트 name 을 그 주소로 해석한다. 소비자 코드는 `import { mount } from "<제공자
          name>"` 뿐이고 주소를 조립하지 않는다(마운트 문법은 기판 소유 — surfaces.view 와 같은
          규율). 빌드형 뷰는 같은 bare 이름을 external 로 넘기면 되므로 **저작 표면이 무빌드
          HTML 과 빌드형 뷰에서 같다**.

          계약은 수출 하나다:
            export function mount(el: HTMLElement, props?: object): { unmount(): void }

          규율 셋:
            자립    번들은 자기 런타임을 안고 나온다 — React 로 저작하면 React 가 번들 안에
                    들어간다. 소비자에게 프레임워크를 요구하지 마라(무빌드 HTML 이 첫 관객이다).
                    크기 때문에 react 를 external 로 빼고 싶어지면 입자를 굵게 잡아라(패키지당
                    번들 하나) — external 은 소비자에게 런타임 제공 전제를 만들고, 그 순간
                    무빌드 소비가 죽는다.
            스타일  스타일도 번들 안에 탄다(마운트 때 심는다). 옆에 CSS 파일로 내지 마라 —
                    소비자가 그 주소를 알아야 하는데 주소에는 제공자의 **설치 이름**이 들어간다.
                    같은 패키지가 다른 이름으로 서는 순간 깨지고, 기판만 아는 좌표를 소비자가
                    조립하는 꼴이다(2026-08-24 실측에서 이 구멍이 드러났다). 한 파일이면 그 축이
                    없다. 내부 클래스는 계약이 아니다 — 테마 seam 은 CSS 변수로 노출하라
                    (채팅 위젯의 --rc-* 가 선례).
            입자    이 축은 **기능 조각**의 형태다(패널, 목록, 지도 — 자기 사각형을 스스로 관리
                    하는 것). 디자인 원자(Button, Card)는 여기 앉지 않는다: children 과 context 와
                    ref 가 명령형 마운트 경계를 넘지 못하고, 런타임 사본이 번들마다 실린다.
                    원자 공유가 필요해지면 소스 합성을 별도 문법으로 세울 일이지 이 축을 늘릴
                    일이 아니다.
        type: object
        additionalProperties: false
        required: [source]
        properties:
          source:
            $ref: '#/$defs/relpath'
          out:
            description: |
              빌드 산출 디렉토리. 선언하면 설치·발행이 <source> 에서 npm install(최초) +
              npm run build 를 돌린다. 산출 안의 index.js 가 진입점이자 전부다(스타일 동봉).
              미선언 = <source> 를 그대로 서빙한다(빌드 없는 손저작 ESM).
              번들은 /pkg/<설치이름>/components/ 아래로 선다. 재빌드는 relay build <패키지>
            $ref: '#/$defs/relpath'
      channels:
        description: |
          외부 대화 표면(Discord, Slack, 메일 등)을 잇는 상주 어댑터들. 어댑터는 글루다:
          외부 이벤트를 착신으로, 회신을 외부 발화로 옮길 뿐 판단하지 않는다. 판단이
          필요하면 착신하라 — 지능은 세션에 산다.
          불변식: **채널의 모든 대화는 RELAY_API 를 통과한다.** 세션 이력·목록·담장·파일
          무대가 전부 기판 장부라서, 장부를 우회한 대화는 기판이 이어가지도 복원하지도
          못한다. 하네스 도구의 내장 채널(Claude Code 의 channels 처럼 MCP 서버가 도구의
          상주 세션에 이벤트를 밀어 넣는 축)이 그래서 채널의 대체물이 못 된다 — 대화가
          그 도구의 세션에 살아 장부 밖인 데다, 기판의 세션은 턴마다 스폰되어 이벤트를
          받아줄 상주 세션 자체가 없다. 어댑터가 내부에서 어떤 라이브러리를 쓰든 자유지만,
          착신·회신은 이 계약대로 기판을 통과시킨다.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, source, entry]
          properties:
            name:
              description: 채널 이름. 서비스와 같은 자격 이름공간을 쓴다 — 겹치면 자격 키가 충돌한다
              $ref: '#/$defs/slug'
            source:
              description: |
                어댑터 디렉토리. 기판이 entry 를 스폰해 상주시키는 프로세스 계약:
                  수명    외부 연결(웹소켓·폴링)의 유지와 재접속은 어댑터 소유다. 네트워크
                          단절에 크래시로 답하지 마라. 프로세스 종료 = 실패, 기판 로그에 남는다.
                  게이트  외부 신원의 검증·허용 판정은 어댑터 소유, 기본 닫힘. 착신은 전부
                          기판 주인(principal)의 권한으로 돌므로 게이트가 곧 보안 경계다 —
                          모르는 발신자는 착신 전에 끊는다 (org 기판의 다중 principal 매핑은
                          추후 축이다). 판정 대상은 방이 아니라 발화자다: 그룹 대화에서
                          방 ID 에 게이트하면 그 방의 전원이 통과해 버린다. 그룹에서는
                          멘션·스레드 참여 같은 플랫폼 관례로 응답 범위를 더 좁힌다(어댑터 소유).
                  봉투    착신 message 는 <channel source="<채널이름>" ...>원문</channel>
                          태그로 감싼다. 발화자 닉네임·대화 키·시각 등 라우팅 맥락은 속성으로
                          싣는다 — 그룹 대화는 한 session 에 발화자가 여럿이라 닉네임은 매 착신마다
                          실어야 세션이 회신 상대를 오인하지 않는다. user 속성(플랫폼의 발화자
                          안정 식별자)은 필수다 — 개인 기판은 게이트에만 쓰지만, org 기판은
                          이 값으로 발신자를 principal 에 결부한다(결부는 권위 소관).
                  착신    왕복의 정본은 클라이언트 전송 계약 v1(docs/client-protocol.md)이고,
                          개설과 관찰이 갈린 두 동사다 — 구 블로킹 POST …/chat 은 은퇴했다.
                          ① 개설  POST {RELAY_API}/pkg/{RELAY_NAME}/turns · Authorization:
                                  Bearer {RELAY_TOKEN} · body {message, session, attachments?}
                                  → 202 {turn, session}. 개설은 턴 종결을 붙들지 않는다.
                          ② 관찰  GET …/turns/<turn>/stream (SSE). data: 한 줄 = 봉투 이벤트
                                  JSON 하나이고 어휘는 하네스 봉투 그대로다(delta·tool·usage·
                                  task·ask·file·reply·error). 스트림의 끝은 수명주기
                                  {event:"turn",status:"settled",ok} 다 — settled 없이 끊긴
                                  스트림은 종결이 아니라 절단이므로 빈 답으로 위장하지 마라.
                                  다시 붙는 문은 GET …/turns/attach?session=<session> 이다.
                  session 대화 연속성의 축. <채널이름>-<대화키> 를 [a-zA-Z0-9._-]{1,64} 로
                          정규화한다. 같은 외부 대화 = 같은 session = 이어지는 세션. 사람이
                          읽을 이름은 POST …/sessions/<session>/rename body {label} 로 앉힌다 —
                          원문 id 는 목록에서 정체를 숨긴다. session(대화)은 영속, 하네스 맥락은
                          회전 가능: 새 대화 시작은 POST …/sessions/<session>/reset — 이력은
                          남고 네이티브 세션만 새로 시작한다. /reset 류 플랫폼 명령으로의
                          번역은 어댑터 소유다.
                  직렬화  **기판이 세션의 유일한 직렬화 지점이다**(§5.1-12) — 같은 session 의
                          턴은 도착순으로 줄 선다. 어댑터 큐는 계약이 아니라 발신 순서를
                          지키기 위한 자기 몫이고, 쌓인 발화를 하나로 합쳐도 된다. 끼어들기는
                          POST …/turns/<turn>/interrupt 로 진행 턴을 끊는다 — 취소로 끝난 턴의
                          오류 이벤트를 외부에 답인 양 내보내지 마라. 다른 session 끼리는 병렬
                          자유. 최소 한 번(at-least-once) 배달 플랫폼의 중복 이벤트 dedup 도
                          어댑터 소유다.
                  진행    긴 턴의 생존 신호(타이핑 표시·진행 편집)는 관찰 스트림의 delta·tool
                          이벤트로 그린다 — 폴링 축은 은퇴했다. 글자 수 제한, 마크다운 방언,
                          메시지 분할, 레이트리밋 등 외부 표면 형편으로의 번역은 전부
                          어댑터 소유다.
                  파일    회신 파일은 관찰 스트림의 file 이벤트로 온다(path = stage 상대경로) —
                          GET …/file/<경로> 로 받아 네이티브 첨부로 내보낸다. 인바운드 첨부는
                          POST …/upload 로 stage 에 앉힌 뒤 그 참조를 attachments 로 넘긴다.
                  발신    stdin 은 기판의 발신 제어 채널이다. 줄 단위 JSON
                          {"type":"post","conversation":"<대화키>","text":"…","files":["<stage 경로>"]?}
                          를 받으면 그 대화에 게시한다 — 트리거 선톡(then.delivery)이 이
                          길로 온다. 선톡이 대화가 되려면 그 턴은 해당 대화의 session 에서
                          돈다(기판 소관) — 사용자의 후속 발화가 같은 session 에 착신되어
                          맥락을 잇는다.
                  실패    비 200 을 침묵으로 뭉개지 마라 — 외부에도 실패로 알린다. 단 내부
                          사정(토큰·경로·스택)은 싣지 않는다. RELAY_TOKEN 과 자격은 외부
                          대화에 절대 노출 금지.
                  검사    기판 적합성 검사(relay harness-check)는 RELAY_CONFORM=1 로 entry 를
                          스폰한다. 어댑터는 이때 외부 연결 없이 자기 서술 JSON 한 줄
                          {"name":"...","protocol":1} 을 stdout 에 내고 0 으로 종료한다 —
                          자격·네트워크 없이 계약 준수를 기계로 판정하기 위한 문이다.
                  검증    자격이 실제로 먹히는지는 저장과 별개다("저장됨 ≠ 유효"). 기판이
                          RELAY_VERIFY=1 + RELAY_CRED_<이름> 으로 entry 를 스폰하면, 어댑터는
                          소켓·상주 없이 그 자격으로 최소 왕복 한 번(예: 자기 정체 조회)만
                          돌려 판정 JSON 한 줄 {"ok":true/false,"note":"..."} 를 stdout 에 내고
                          종료한다 — 상주 프로세스는 건드리지 않는다. note 에 내부 사정을 싣지
                          마라. 미구현이면 이 문 없이 스폰이 상주로 흐르는데, 그러면 검증이
                          "저장만" 으로 강등되니 화면이 유효 여부를 정직히 표시하려면 구현하라.
                env = RELAY_NAME, RELAY_CHANNEL(이 채널 이름), RELAY_API, RELAY_TOKEN.
                봇 토큰 류 자격은 vault 에 채널 이름 소속으로 앉아(relay connect <패키지>
                <채널이름>) RELAY_CRED_<이름> 으로 주입된다 — 코드·매니페스트에 박지 마라.
                권한 릴레이(진행 턴의 도구 승인 프롬프트를 채널로 중계하고 판정을
                회신받는 축)는 아직 계약 밖이다.
              $ref: '#/$defs/relpath'
            entry:
              description: source 안 어댑터 진입 파일 — 기판 러너가 프로세스로 스폰해 상주시킨다
              $ref: '#/$defs/relpath'
            icon:
              description: 채널 배지 아이콘 (패키지 상대경로, 이미지 파일) — 그래프 카드 상단에 배지로 뜬다
              $ref: '#/$defs/relpath'
            credential:
              description: |
                이 채널이 요구하는 자격의 **형태** 선언. 값이 아니라 형태다 — 값은 vault 에 산다.
                화면(콘솔 채널 다이얼로그)이 이 선언으로 입력 칸을 그린다. 선언이 없으면 화면은
                원시 붙여넣기 칸으로 물러난다: 제3자 어댑터가 선언 없이도 연결 가능해야 하기 때문이다.
                자격 형태를 아는 것은 어댑터뿐인데 화면이 그것을 알 길이 없어서, 지금까지는
                사람이 JSON 을 손으로 조립해야 했다(그 예시가 어댑터의 실제 키와 어긋나 있었다).
                조립 규칙: 모든 field 에 key 가 있으면 화면이 JSON 객체로 조립해 넘기고,
                key 없는 field 하나뿐이면 그 값이 곧 자격 문자열이다. 둘을 섞으면 판정 실패다.
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [label]
                    properties:
                      key:
                        description: 조립될 JSON 키. 생략하면 자격이 문자열 하나라는 뜻(단독일 때만)
                        type: string
                        pattern: '^[a-z][a-z0-9_]*$'
                      label:
                        type: string
                        minLength: 1
                      placeholder:
                        type: string
                      secret:
                        description: 참이면 화면이 값을 가린다. 토큰 류는 참
                        type: boolean
                      list:
                        description: 참이면 쉼표 구분 입력을 배열로 조립한다 (key 있는 필드만)
                        type: boolean
                      required:
                        description: 참이면 이 칸이 비면 화면이 연결을 막는다
                        type: boolean
                help:
                  description: 자격을 어디서 얻는지 — 화면이 링크와 안내로 보여준다
                  type: object
                  additionalProperties: false
                  properties:
                    url:
                      type: string
                    note:
                      type: string
  harness:
    type: object
    additionalProperties: false
    properties:
      variants:
        description: |
          동봉한 하네스 어댑터 후보들(agents 선언 시 최소 1). 선언 = 후보 목록(BOM), 활성 선택 = 장부.
          설치가 각 후보의 setup 을 순서대로 점검해 첫 통과를 활성으로 고르고,
          relay harness <패키지> [이름] 으로 바꾼다
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, source, entry]
          properties:
            name:
              $ref: '#/$defs/slug'
            source:
              description: 실행 어댑터 디렉토리
              $ref: '#/$defs/relpath'
            entry:
              description: |
                source 안 실행 어댑터 파일. 첫 인자가 동사인 프로토콜:
                  session [prompt]  세션 1회 (prompt 없으면 TTY 상속). headless 출력 = 아래 '세션 봉투'
                  setup             진단(읽기). 도구 실재·로그인 점검. 종료코드가 미준비의 축을 가른다:
                                    0 = 준비됨 · 3 = 도구 없음(설치 필요) · 그 외 비0 = 자격 없음(로그인 필요).
                                    사유와 다음 한 걸음을 stdout 에. 화면은 이 축으로 처방을 고르므로
                                    도구 없음을 자격 없음으로 뭉뚱그리면 사용자에게 헛된 토큰 입력창이 뜬다
                  login [--switch|--token]
                                    처방(쓰기). 대화형 인증 — TTY 를 그대로 물려받는다(exec).
                                    자격을 만드는 유일한 동사이므로 setup 이 대신 수행하지 않는다.
                                    이미 로그인된 상태에서도 호출된다 = 계정 전환 경로. --switch 는
                                    기존 자격을 비우고 다시 로그인한다(도구가 '이미 로그인됨' 으로 끝내
                                    전환이 막히는 구현이 있어 전환은 명시 동작이어야 한다).
                                    사람이 볼 터미널 창을 전제하지 마라: 기판은 pty(script)로 감싸
                                    데몬 안에서 돌리고 출력·입력을 화면과 중계한다(headless 로그인).
                                    URL·코드·프롬프트는 평문 한 줄로, 입력은 줄 단위 stdin 으로 받아라.
                                    전체화면 TUI·화면지우기·raw key 입력에 기대면 창을 여는 폴백으로 강등된다
                                    **자격이 도구 소유(oauth·구독)인 어댑터는 login 이 필수다** —
                                    없으면 사용자가 GUI 에서 그 하네스를 쓸 길이 없다. 기판은 터미널 창을
                                    열어 이 동사를 돌린다(POST /pkg/<이름>/harness/login). 인증 자체는
                                    그 창이 소유하고 기판은 문만 연다. --token 은 장기 토큰 발급(선택).
                                    자격이 기판 소유(auth.kind: token)면 login 없이 vault 연결로 충분하다.
                                    지원하면 info.verbs 에 'login' 을 싣는다 — 화면이 이걸 보고 버튼을 띄운다
                  models            지원 모델 목록 (JSON 배열). 모든 항목은 세션의 --model 이 실제로
                                    받는 값이어야 한다. 자격 미도달이면 도구가 스스로 선언하는 어휘
                                    (조회 명령·설정·카탈로그 캐시·--help 의 별칭 문서)까지만 강등하고
                                    사유를 stderr 에 남긴다. 어댑터 소스에 어휘를 하드코딩하지 마라 —
                                    별칭이라도 CLI 버전과 어긋나면 없는 모델이 정본 행세를 한다
                                    (2026-08-07 fable 실사고). 검증할 어휘가 없으면 다음 한 걸음을
                                    적은 안내 항목 하나로 강등한다(빈 목록 금지)
                  commands          하네스 내장 슬래시 커맨드 목록 (JSON 배열 [{name, description, tty}])
                  info              자기 서술 {name, provider, verbs, protocol, capabilities, account}.
                                    protocol 2 = 세션 봉투를 말한다. capabilities 는 구현 의지가 아니라
                                    물리적 능력만 선언한다: cancel(stdin 제어 수신), vision(이미지 해석),
                                    effort(RELAY_EFFORT 반영), resume(네이티브 세션 이어가기)
                세션 봉투 (protocol 2 의 headless 계약): stdout 은 줄 단위 JSON 이벤트다.
                  {"event":"delta","text"}                        중간 텍스트 (충실도는 도구가 주는 만큼)
                  {"event":"tool","name","status":"start"|"end"}  도구 호출 진행
                  {"event":"file","path"}                         stage 상대경로 산출물 (기판 diff 의 보조)
                  {"event":"reply","text","session","model","usage"}  종결, 정확히 한 번. session = 네이티브
                    세션 id, model = 실제 사용 모델, usage = {input, output, context_window} 토큰 장부
                  {"event":"error","message"}                     실패 종결 (exit != 0 과 함께)
                최소 구현 = 종결 reply 한 줄. 실패를 텍스트로 위장하지 않는다 — 실패는 종료코드로,
                사유는 stderr 나 error 이벤트로. stdin 은 제어 채널: {"type":"cancel"} 수신 시 정리 후
                종료(capabilities 에 cancel 선언 시). 미선언 어댑터는 기판이 프로세스를 죽인다.
                봉투 없는 stdout(구형)은 기판이 통짜 응답으로 받아준다 — 신규 어댑터는 봉투가 필수다.
                env = RELAY_NAME, RELAY_AGENT, RELAY_PRINCIPAL, RELAY_API, RELAY_TOKEN, RELAY_SESSION,
                RELAY_BUNDLE, RELAY_MODEL(선택), RELAY_EFFORT(선택 — 모르는 값은 무시).
                같은 RELAY_SESSION 재호출 = 대화 이어가기.
                RELAY_BUNDLE = 중립 번들(persona.md, agents/<sub>.md 본문, skills/, commands/,
                meta.json{pkg, agent, slot, cwd, stage, hooks.deny[], agents[], mcp{url,authorization}}).
                네이티브 형식(설정 파일, 플래그, MCP 배선)으로의 번역은 전부 어댑터 소유이며 산출물은
                번들 안에 쓴다. cwd = 결재된 workspace + harness.workdir(선언 시) — 둘이 갈리는
                패키지가 있으므로 번들 키 이름도 workspace 가 아니라 cwd 다.
                불변식 셋: ① 오염 금지 — 사용자의 설정 디렉토리와 cwd 에
                쓰지 않는다. ② 혼입 금지 — 사용자 개인 설정(스킬·메모리·MCP)이 세션에 새어들지 않게
                한다. ③ 자격 보존 — 도구 자신의 자격 경로(Keychain 등)를 끊지 않는다. 설정 디렉토리
                격리는 자격이 기판 손(env 주입)에 있을 때만 성립한다. hooks.deny 는 네이티브 권한
                규칙 + 훅 가드로 이중 번역한다 (가드레일이지 샌드박스가 아니다)
              $ref: '#/$defs/relpath'
            binary:
              description: |
                이 변형이 모는 실행 파일 — requires.binaries[].name **참조**. 레시피(manager·
                package)는 requires 한 곳에만 산다(같은 사실을 두 곳에 적지 않는다). 참조가
                걸린 변형은 setup 실패 시 기판이 그 레시피로 사본을 깔고 재시도한다 — 껍데기만
                남은 호스트 설치(존재하지만 실행 불능)가 존재 검사를 통과해도 여기서 덮인다.
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
            icon:
              description: 어댑터 도구 아이콘 (패키지 상대경로 이미지) — 카드 하네스 필과 설정 목록에 뜬다
              $ref: '#/$defs/relpath'
            llm:
              description: 이 하네스가 소비하는 LLM provider. 자격은 vault 에 provider 소속(llm/<provider>)으로 앉아 패키지 간 공유. auth.env 를 선언하면 kind 무관하게 기판이 그 이름으로 자격을 스폰 시점에 댄다(무인 기판에는 로그인할 사람이 없다 — 이음새가 비면 항등). kind oauth 에서 env 미선언 = 도구 자신의 로그인(setup 동사가 점검). llm 자체 미선언 = 어댑터가 자기 도구의 기존 로그인을 쓴다
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: '#/$defs/slug'
                icon:
                  description: provider(모델) 아이콘 (패키지 상대경로 이미지) — 모델 선택 목록과 카드 필에 뜬다
                  $ref: '#/$defs/relpath'
                auth:
                  $ref: '#/$defs/auth'
      workdir:
        description: |
          세션 cwd 의 workspace 하위 상대경로 (미선언 = workspace 루트).
          workspace 자체는 매니페스트가 아니라 설치 결재다 — 사용자가 폴더를 고르고 장부에 남는다
        $ref: '#/$defs/relpath'
  agents:
    description: |
      착지점 = default: true 선언 에이전트, 미선언이면 패키지 짧은 이름과 같은 에이전트 관례.
      persona 는 agents/<name>/AGENT.md.
      **에이전트를 선언했으면 착지가 정해져야 한다** — 명시도 관례도 착지를 못 정하면 설치가
      거부한다. 착지 없이 통과시키면 대화의 문이 없는 패키지가 서고, 턴은 페르소나 없는
      세션으로 강등된다. 세션은 페르소나 위에 서므로 선언 밖 이름으로는 턴이 열리지 않는다:
      기본 페르소나 합성은 은퇴했고(조용한 강등), 개설(POST /turns)의 명시 agent 도
      민팅과 같이 E_BAD_AGENT 로 거절된다
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, persona]
      properties:
        name:
          $ref: '#/$defs/slug'
        default:
          description: |
            main 슬롯 착지점 — 최대 1. 명시 선언은 "짧은 이름과 같은 에이전트" 관례의 상위 호환.
            에이전트 이름이 패키지 짧은 이름과 다르면 이 선언이 착지를 정하는 유일한 길이다
          type: boolean
        persona:
          description: 페르소나 마크다운 파일
          $ref: '#/$defs/relpath'
        greeting:
          description: |
            빈 대화의 첫 인사말. 인사말은 창구가 아니라 말하는 쪽 소속이다 — 같은 에이전트가
            chat·Discord·트리거 선톡 어디로 나가든 같은 입이고, 에이전트가 여럿이면 인사말도
            여럿이다. 세션 번들 meta.json 에 그 에이전트 몫이 실리고, 착지 에이전트의 것이
            instances 열거의 greeting 으로 나간다
          type: string
          minLength: 1
        skills:
          description: 스킬 디렉토리 (<skill>/SKILL.md) — 하네스 네이티브 스킬로 조립
          $ref: '#/$defs/relpath'
        commands:
          description: 슬래시 커맨드 디렉토리 (<cmd>.md) — 하네스 네이티브 커맨드로 조립, TTY 와 headless 양쪽에서 동작
          $ref: '#/$defs/relpath'
        dispatch:
          type: array
          items:
            $ref: '#/$defs/slug'
        scripts:
          description: 세션에 조립되는 동사 scope. scripts/<이름>.ts 실재 검증(fail-loud), 접두 glob 허용
          type: array
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*\*?$'
        dirs:
          description: |
            이 에이전트가 세션에서 여는 폴더 — services[] 의 dir 선언 **이름**을 가리킨다.
            선언된 폴더 하나가 도구 넷이 된다: dir__<이름>__{list,read,write,remove}.
            미선언 = 안 보인다. 세션이 딛는 땅은 workspace 하나이고(cwd — 네이티브 파일 도구가
            그냥 닿는다), **그 밖의 폴더는 경로가 아니라 이 문으로만** 닿는다. 세션에는 폴더의
            절대경로가 나가지 않는다: 흘리면 도구를 우회해 파일시스템을 직접 만지려는 시도가
            따라오고, 그 경로는 조직 기판에서 아무 데도 아니다.
            선언 밖 이름은 판정이 거부한다(캡은 선언을 넘지 못한다)
          type: array
          items:
            $ref: '#/$defs/slug'
  scripts:
    description: |
      동사 디렉토리. <이름>.ts = 기본 수출 async 함수 (input, ctx) => 결과 JSON.
      동사는 meta 를 함께 수출할 수 있다 — 세션 문(MCP tools/list)이 그 서술과 입력 형을 싣는다:
      export const meta = { description: "…", input: {type:"object", …}, output: {…} }.
      이름은 meta 에 없다(파일명이 정본 — 두 곳에 적으면 어긋난다). input/output 은 JSON Schema
      리터럴이고 기판은 형을 광고만 한다: 검증기는 의존이고 의존성 0 규율이 형 광고보다 먼저다
      (입력 판정은 동사 본문의 몫). 미지 키는 무시된다 — meta 는 코드지 manifest 가 아니라
      선언-실체 판정의 대상이 아니다. meta 없는 동사는 무변 — 서술은 기판이 자동 합성하고
      입력 형은 개방 스키마가 된다.
    type: object
    additionalProperties: false
    required: [source]
    properties:
      source:
        $ref: '#/$defs/relpath'
  services:
    description: |
      패키지가 닿는 몸의 선언 — 네 형이 한 배열에 산다. source 는 기판이 띄우는 자기 몸
      (컨테이너·프로세스), url 은 원격 MCP 문, api 는 원격 REST 베이스, dir 은 기판이 세우는
      파일 문이다.
      바깥으로 나가는 형(url·api)은 자격 계약(auth)을 자기 소속으로 갖는다 — 좌표는 vault 의
      <패키지>/<서비스 이름> 하나, 연결은 relay connect <패키지> <서비스> 하나다.
      **계약의 집은 여기 한 곳이다.** 서비스 밖에 자격을 두면 같은 사실이 두 곳에 적히고,
      이름 없는 자격이 서비스 이름공간을 말없이 차지하며(vault 키 충돌을 판정이 못 본다),
      고지서·per-user 축(org.per_user.accounts)이 서로 다른 어휘로 같은 것을 부르게 된다.
      몸 없는 커넥터도 이 문법 안에 산다: upstream 이 REST 면 api 형이 그 계약의 전부다
    type: array
    items:
      oneOf:
        - $ref: '#/$defs/sourceService'
        - $ref: '#/$defs/urlService'
        - $ref: '#/$defs/apiService'
        - $ref: '#/$defs/dirService'
  triggers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, when, then]
      properties:
        id:
          $ref: '#/$defs/slug'
        label:
          description: 표시명 (선택) — 화면 목록이 id 대신 그린다
          type: string
          minLength: 1
        when:
          oneOf:
            - type: object
              additionalProperties: false
              required: [cron]
              properties:
                cron:
                  type: string
                  minLength: 1
                tz:
                  type: string
            - type: object
              additionalProperties: false
              required: [event]
              properties:
                event:
                  type: string
                  minLength: 1
                filter:
                  type: object
                debounce_ms:
                  type: integer
                  minimum: 0
        then:
          oneOf:
            - type: object
              additionalProperties: false
              required: [agent, prompt]
              properties:
                agent:
                  $ref: '#/$defs/slug'
                prompt:
                  type: string
                  minLength: 1
                route:
                  type: string
                  pattern: '^/'
                delivery:
                  description: |
                    선톡 좌표 '<채널이름>:<대화키>'. 기판이 이 트리거의 턴을 그 대화의
                    slot(<채널이름>-<대화키>)에서 돌리고, reply 를 어댑터 stdin 발신
                    (post)으로 배달한다 — 후속 발화가 같은 slot 에 착신되어 대화가 이어진다.
                    미선언 = 세션 결과가 콘솔 세션 목록(trigger-<id> slot)에만 남는다
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,39}:.+$'
            - type: object
              additionalProperties: false
              required: [script]
              properties:
                script:
                  description: scripts/<이름>.ts headless 실행(세션 없음)
                  $ref: '#/$defs/slug'
  missions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
  edges:
    description: |
      선언은 신청, 활성화는 결재. 혈통이 같은 설치본이 여럿이면 결재가 디렉토리에 바인딩한다.
      소비물은 셋 중 하나다(동시 선언 불가): tools(동사, 런타임 결재) · mission(질의,
      런타임 결재) · components(제공자의 surfaces.components 번들을 이 패키지 화면이 마운트 —
      설치 시점 해석이 결재이고, 집행은 기판이 심는 import map 이다)
    type: array
    items:
      type: object
      additionalProperties: false
      required: [provider]
      not:
        anyOf:
          - required: [tools, mission]
          - required: [tools, components]
          - required: [mission, components]
      properties:
        provider:
          $ref: '#/$defs/provider'
        tools:
          type: array
          items:
            $ref: '#/$defs/slug'
        mission:
          type: string
          minLength: 1
        components:
          description: |
            provider 의 surfaces.components 번들을 이 패키지 화면이 마운트 — true 만.
            설치가 해석하면 기판이 소비자 문서에 import map 을 심는다: provider 매니페스트
            name 이 그 번들 주소가 된다. 화면은 `import { mount } from "<provider name>"`.
          const: true
  host_methods:
    description: |
      기판 host 브리지 게이트 선언 — 이 패키지의 동사가 부를 수 있는 host.* 메서드의 캡.
      선언은 캡이고 집행은 기판 소유다: ring-0 설치 결재가 문을 열고, 선언이 있으면 목록 밖
      메서드는 거부된다(미선언 = 전체, ring-0 결재가 유일한 경계 — 현행 호환). 고지서에
      실린다. 개인 기판의 메서드 이름은 host.<동사_스네이크>(예 host.draft_publish),
      org 기판은 host.<도메인>.<동사>(예 host.members.list) — 두 표기 모두 이 문법 안이다.
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^host\.[A-Za-z0-9]+([._][A-Za-z0-9]+)*$'
  org:
    description: org 기판이 호스팅할 때만 읽는 확장. 1인 기판과 등록 노드에서는 무시된다
    type: object
    additionalProperties: false
    properties:
      per_user:
        type: object
        additionalProperties: false
        properties:
          accounts:
            description: |
              자격 축. url/api/dir 서비스 이름 또는 edge provider 좌표 — 이름의 어휘는
              서비스 이름 하나다. 커넥터 특례(패키지 짧은 이름)는 은퇴했다: 같은 배열에
              두 어휘가 섞이면 'erp' 가 서비스인지 패키지 짧은 이름인지 매니페스트를 열어야 안다
            type: array
            items:
              type: string
              minLength: 1
          replicas:
            description: 복제 축. source 서비스 이름만, disk 와 병용 불가
            type: array
            items:
              $ref: '#/$defs/slug'
$defs:
  slug:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
  relpath:
    type: string
    minLength: 1
    allOf:
      - not:
          pattern: '^[/~]'
      - not:
          pattern: '(^|/)\.\.(/|$)'
  dirpath:
    type: string
    minLength: 1
    allOf:
      - not:
          pattern: '^/'
      - not:
          pattern: '(^|/)\.\.(/|$)'
  provider:
    type: string
    pattern: '^@[a-z0-9-]+/[a-z0-9][a-z0-9-]{1,39}(@[^\s@]+)?$'
  resources:
    type: object
    additionalProperties: false
    properties:
      memory:
        type: string
        pattern: '^\d+(Mi|Gi)$'
      cpu:
        type: number
        exclusiveMinimum: 0
  auth:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: none
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: token
          env:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
          service:
            description: org 기판 자격 브로커의 서비스 키 (예 google-drive) — 브로커 없는 기판은 무시
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          help:
            type: object
            additionalProperties: false
            properties:
              url:
                type: string
              note:
                type: string
          verify:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url:
                type: string
              headers:
                type: object
                additionalProperties:
                  type: string
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: oauth
          env:
            description: 기판이 자격을 댈 env 이름 (kind 무관 — 무인 기판이 스폰 시점에 싣는다. 1인 기판은 이음새가 비어 도구 자신의 로그인이 답)
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
          client:
            enum: [dcr, registered]
          service:
            description: org 기판 자격 브로커의 서비스 키 — 브로커 없는 기판은 무시
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          oauth_client:
            type: object
            additionalProperties: false
            properties:
              scopes:
                type: array
                items:
                  type: string
              auth_meta:
                type: object
                additionalProperties: false
                properties:
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  registration_endpoint:
                    type: string
                  authorize_params:
                    type: object
                    additionalProperties:
                      type: string
  sourceService:
    type: object
    additionalProperties: false
    required: [name, source]
    anyOf:
      - required: [dockerfile]
      - required: [entry]
    properties:
      name:
        $ref: '#/$defs/slug'
      source:
        description: 서비스 몸 디렉토리. env = RELAY_NAME, RELAY_API, RELAY_TOKEN. 선언한 port 에서 listen, 영속 데이터는 /data(disk 선언 시)
        $ref: '#/$defs/relpath'
      dockerfile:
        description: 컨테이너 형 — 발행·설치가 굽는다
        $ref: '#/$defs/relpath'
      entry:
        description: 프로세스 형 진입 파일 — 기판 러너가 실행
        $ref: '#/$defs/relpath'
      disk:
        type: string
        pattern: '^\d+(Mi|Gi)$'
      resources:
        $ref: '#/$defs/resources'
      port:
        type: integer
        minimum: 1
        maximum: 65535
  urlService:
    type: object
    additionalProperties: false
    required: [name, url]
    properties:
      name:
        $ref: '#/$defs/slug'
      url:
        description: |
          원격 MCP 문 주소 — 동사는 ctx.service(<이름>).call(도구, 인자) 로 부른다.
          문의 말이 MCP 가 아닌 평범한 REST 면 이 형이 아니라 api 형이다
        type: string
        pattern: '^https?://'
      tools:
        type: array
        items:
          $ref: '#/$defs/slug'
      auth:
        description: 이 서비스의 자격 계약 — 값은 vault 의 <패키지>/<이 서비스 이름> 좌표에 앉는다
        $ref: '#/$defs/auth'
  apiService:
    description: |
      REST 몸 — upstream 이 MCP 가 아니라 평범한 HTTP API 인 서비스. 기판이 몸을 띄우지
      않는다는 점은 url 형과 같고, 문의 말이 MCP 가 아니라는 점만 다르다. 동사는
      ctx.service(<이름>).fetch(경로, init) 로 부르고 자격을 손에 쥐지 않는다 — 기판이
      선언된 auth 를 요청 시점에 풀어 Authorization 을 붙인다(env 상주 없음, 회전은
      다음 호출부터 선다). 자격이 동사의 손을 지나지 않으므로 base 밖으로 새는 길이 없다
    type: object
    additionalProperties: false
    required: [name, api]
    properties:
      name:
        $ref: '#/$defs/slug'
      api:
        description: |
          REST 베이스 URL. 동사의 요청은 이 접두 밖으로 나가지 못한다 — 집행이 기판 손에
          있어서 고지서의 "이 자격은 이 호스트로만 나갑니다"가 홍보가 아니라 사실이 된다.
          선언만 받고 집행하지 않으면 이 줄은 거짓말이 될 수 있는 자리다
        type: string
        pattern: '^https?://'
      auth:
        description: 이 서비스의 자격 계약 — 값은 vault 의 <패키지>/<이 서비스 이름> 좌표에 앉는다
        $ref: '#/$defs/auth'
  dirService:
    type: object
    additionalProperties: false
    required: [name, dir]
    properties:
      name:
        $ref: '#/$defs/slug'
      dir:
        description: |
          상대경로 = 패키지 내부(자기 소유), '~' 경로 = 신청(설치 결재로 바인딩).
          **정본은 경로가 아니라 이름이다** — 여기 적는 경로는 로컬 기판의 기본 바인딩이고,
          설치 결재(relay install --bind <이름>=<경로>)가 그것을 갈아 끼운다. 조직 기판은 같은
          이름을 자기 볼륨 좌표로 푼다(누구의 폴더인가 — 인스턴스당이냐 사람당이냐 — 는 그쪽
          정책이라 이 문법에는 없다).
          닿는 길은 둘이고 둘 다 기판이 세운 문이다: 동사는 ctx.service(<이름>).call("list"|
          "read"|"write"|"remove", 인자), 세션은 agents[].dirs 로 캡을 선언한 도구
          dir__<이름>__*. 감금(상대경로만·.. 금지·심링크 탈출 금지)은 기판의 몫이다.
          경로 문자열이 필요한 동사는 ctx.dir(<이름>) 로 받는다 — 세션에는 나가지 않는다.
          자기 workspace 안쪽을 가리키지 않는다: 그 땅은 이미 결재됐고 고지서에 같은 폴더가
          두 번 선다. 기판 홈(RELAY_HOME) 안쪽은 설치가 거부한다 — 그 폴더에는 자격과 장부의
          시크릿이 살고, 세션이 dir 을 도구로 열 수 있으므로 여기 구멍이 나면 담장이 한 축에서만
          선다(판정 자리는 supply/install.ts: RELAY_HOME 은 인스턴스 설정이라 문법 판정이 알아서는
          안 된다). 상대경로 선언은 이 판정을 지나지 않는다 — 발행본의 트리가 장기 안에 앉는다
        $ref: '#/$defs/dirpath'
