$schema: "https://json-schema.org/draft/2020-12/schema"
$id: relay/v1
title: relay.yaml
description: |
  에이전트 패키지 매니페스트 = 패키지의 BOM. 패키지 = 디렉토리 하나. relay.yaml 이 구조와
  경로의 정본, 트리가 내용의 정본. 기판은 여기 선언된 경로 밖의 파일을 읽지 않고,
  선언-실체 불일치는 설치 fail-loud. 관례 배치 (경로는 전부 relay.yaml 선언값):
    relay.yaml
    assets/icon.svg                  icon
    agents/<name>/AGENT.md           agents[].persona. 스킬 = agents[].skills/<skill>/SKILL.md
    scripts/<이름>.ts                scripts.source 아래 동사. 기본 수출 async 함수 (input, ctx) => 결과 JSON (+ 선택 meta 수출)
    surfaces/view/                   surfaces.view.source (+ out 선언 시 발행이 빌드해 <source>/<out> 서빙)
    surfaces/components/             surfaces.components.source — 다른 패키지 view 가 소비하는 npm 패키지(package.json + 소스)
    channels/<name>/                 channels[].source + entry
    harness/<name>/                  harness.variants[].source + entry
    services/<name>/                 services[].source + dockerfile(컨테이너 형) 또는 entry(프로세스 형)
type: object
additionalProperties: false
required: [schema, name, version, display_name, description, surfaces]
properties:
  schema:
    const: relay/v1
  name:
    type: string
    pattern: '^@[a-z0-9-]+/[a-z0-9][a-z0-9-]{1,39}$'
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
  display_name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  icon:
    type: string
  publisher:
    description: 발행 주체 좌표 (@scope). 스토어 리스팅·정산이 읽는다 — 개인 기판은 표시 외 소비 없음
    type: string
    pattern: '^@[a-z0-9-]+$'
  released_at:
    description: 발행일 YYYY-MM-DD. 스토어 리스팅 메타 — 개인 기판은 표시 외 소비 없음
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  changelog:
    description: 판 변경 기록(마크다운) — 스토어 리스팅·업그레이드 화면 메타. 저작은 보통 CHANGELOG.md 를 발행이 합성한다
    type: string
    minLength: 1
  requires:
    description: |
      호스트 환경 요구 = 설치 관문. validate 는 형태만 판정하고, 설치가 실체를 판정해
      미충족이면 fail-loud. 기판은 안내(install)만 전하고 대신 설치하지 않는다.
      os 는 process.platform 값, binaries 는 PATH 에서, apps 는 /Applications 계열에서 찾는다.
    type: object
    additionalProperties: false
    properties:
      os:
        description: 지원 OS 닫힌집합. 미선언 = 모든 OS
        type: array
        minItems: 1
        items:
          enum: [darwin, linux, win32]
      binaries:
        description: PATH 에 있어야 하는 실행 파일
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
            install:
              description: 미충족 판정문에 실리는 설치 안내 (명령 또는 URL)
              type: string
              minLength: 1
      apps:
        description: 데스크톱 앱 번들. darwin 전용 — 선언 시 os 는 [darwin]
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              description: '.app 확장자를 뺀 번들 이름 (예: Slack, Google Chrome)'
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$'
              not:
                pattern: '\.app$'
            install:
              type: string
              minLength: 1
    if:
      required: [apps]
    then:
      required: [os]
      properties:
        os:
          items:
            const: darwin
  surfaces:
    type: object
    additionalProperties: false
    properties:
      view:
        description: 화면 소스. out 미선언 = source 정적 서빙, out 선언 = 발행이 빌드 후 <source>/<out> 서빙
        type: object
        additionalProperties: false
        required: [source]
        properties:
          source:
            $ref: '#/$defs/relpath'
          out:
            description: |
              빌드 산출 디렉토리. 선언하면 설치가 <source> 에서 npm install(최초) + npm run build 를 돌린다.
              화면은 /pkg/<설치이름>/view/ 아래로 서빙되고 설치 이름은 설치 시점에 정해지므로,
              기판이 그 접두사를 RELAY_BASE_PATH 로 주입한다. 프레임워크의 basePath 를 여기에 맞춰라
              (Next.js: basePath: process.env.RELAY_BASE_PATH). 재빌드는 relay build <패키지>
            $ref: '#/$defs/relpath'
      components:
        description: |
          컴포넌트 수출 — source 가 npm 패키지(package.json + 소스) 그 자체다. 다른 패키지의
          view 가 edges[].components 선언으로 이 소스를 소비한다: 기판이 설치·발행 시점에
          npm pack 으로 tgz 를 굽고 소비 view 의 package.json "*" 의존을 file: 로 고정한다 —
          레지스트리 없음. 규율 셋:
            좌표    package.json name 은 매니페스트 name 과 같아야 한다(판정 fail-loud) —
                    소비자 package.json 의 의존 키가 곧 이 좌표다.
            싱글턴  react 나 UI 킷 같은 공유 라이브러리는 peerDependencies 로만 선언한다.
                    dependencies 로 안으면 tgz 전개본이 자기 사본을 갖게 되어 소비 view 와
                    React 인스턴스·context 가 갈린다(조용히 깨지는 축).
            중첩    컴포넌트 패키지가 다른 패키지의 components 를 소비하는 것은 계약 밖이다 —
                    해석 순서·순환 게이트를 만드느니 한 단계가 규율이다.
        type: object
        additionalProperties: false
        required: [source]
        properties:
          source:
            $ref: '#/$defs/relpath'
      chat:
        type: object
        additionalProperties: false
        required: [mode]
        properties:
          mode:
            enum: [direct, none]
          greeting:
            type: string
      channels:
        description: |
          외부 대화 표면(Discord, Slack, 메일 등)을 잇는 상주 어댑터들. 어댑터는 글루다:
          외부 이벤트를 착신으로, 회신을 외부 발화로 옮길 뿐 판단하지 않는다. 판단이
          필요하면 착신하라 — 지능은 세션에 산다.
          불변식: **채널의 모든 대화는 RELAY_API 를 통과한다.** 세션 이력·목록·담장·파일
          무대가 전부 기판 장부라서, 장부를 우회한 대화는 기판이 이어가지도 복원하지도
          못한다. 하네스 도구의 내장 채널(Claude Code 의 channels 처럼 MCP 서버가 도구의
          상주 세션에 이벤트를 밀어 넣는 축)이 그래서 채널의 대체물이 못 된다 — 대화가
          그 도구의 세션에 살아 장부 밖인 데다, 기판의 세션은 턴마다 스폰되어 이벤트를
          받아줄 상주 세션 자체가 없다. 어댑터가 내부에서 어떤 라이브러리를 쓰든 자유지만,
          착신·회신은 이 계약대로 기판을 통과시킨다.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, source, entry]
          properties:
            name:
              description: 채널 이름. 서비스와 같은 자격 이름공간을 쓴다 — 겹치면 자격 키가 충돌한다
              $ref: '#/$defs/slug'
            source:
              description: |
                어댑터 디렉토리. 기판이 entry 를 스폰해 상주시키는 프로세스 계약:
                  수명    외부 연결(웹소켓·폴링)의 유지와 재접속은 어댑터 소유다. 네트워크
                          단절에 크래시로 답하지 마라. 프로세스 종료 = 실패, 기판 로그에 남는다.
                  게이트  외부 신원의 검증·허용 판정은 어댑터 소유, 기본 닫힘. 착신은 전부
                          기판 주인(principal)의 권한으로 돌므로 게이트가 곧 보안 경계다 —
                          모르는 발신자는 착신 전에 끊는다 (org 기판의 다중 principal 매핑은
                          추후 축이다). 판정 대상은 방이 아니라 발화자다: 그룹 대화에서
                          방 ID 에 게이트하면 그 방의 전원이 통과해 버린다. 그룹에서는
                          멘션·스레드 참여 같은 플랫폼 관례로 응답 범위를 더 좁힌다(어댑터 소유).
                  봉투    착신 message 는 <channel source="<채널이름>" ...>원문</channel>
                          태그로 감싼다. 발화자 닉네임·대화 키·시각 등 라우팅 맥락은 속성으로
                          싣는다 — 그룹 대화는 한 session 에 발화자가 여럿이라 닉네임은 매 착신마다
                          실어야 세션이 회신 상대를 오인하지 않는다. user 속성(플랫폼의 발화자
                          안정 식별자)은 필수다 — 개인 기판은 게이트에만 쓰지만, org 기판은
                          이 값으로 발신자를 principal 에 결부한다(결부는 권위 소관).
                  착신    왕복의 정본은 클라이언트 전송 계약 v1(docs/client-protocol.md)이고,
                          개설과 관찰이 갈린 두 동사다 — 구 블로킹 POST …/chat 은 은퇴했다.
                          ① 개설  POST {RELAY_API}/pkg/{RELAY_NAME}/turns · Authorization:
                                  Bearer {RELAY_TOKEN} · body {message, session, attachments?}
                                  → 202 {turn, session}. 개설은 턴 종결을 붙들지 않는다.
                          ② 관찰  GET …/turns/<turn>/stream (SSE). data: 한 줄 = 봉투 이벤트
                                  JSON 하나이고 어휘는 하네스 봉투 그대로다(delta·tool·usage·
                                  task·ask·file·reply·error). 스트림의 끝은 수명주기
                                  {event:"turn",status:"settled",ok} 다 — settled 없이 끊긴
                                  스트림은 종결이 아니라 절단이므로 빈 답으로 위장하지 마라.
                                  다시 붙는 문은 GET …/turns/attach?session=<session> 이다.
                  session 대화 연속성의 축. <채널이름>-<대화키> 를 [a-zA-Z0-9._-]{1,64} 로
                          정규화한다. 같은 외부 대화 = 같은 session = 이어지는 세션. 사람이
                          읽을 이름은 POST …/sessions/<session>/rename body {label} 로 앉힌다 —
                          원문 id 는 목록에서 정체를 숨긴다. session(대화)은 영속, 하네스 맥락은
                          회전 가능: 새 대화 시작은 POST …/sessions/<session>/reset — 이력은
                          남고 네이티브 세션만 새로 시작한다. /reset 류 플랫폼 명령으로의
                          번역은 어댑터 소유다.
                  직렬화  **기판이 세션의 유일한 직렬화 지점이다**(§5.1-12) — 같은 session 의
                          턴은 도착순으로 줄 선다. 어댑터 큐는 계약이 아니라 발신 순서를
                          지키기 위한 자기 몫이고, 쌓인 발화를 하나로 합쳐도 된다. 끼어들기는
                          POST …/turns/<turn>/interrupt 로 진행 턴을 끊는다 — 취소로 끝난 턴의
                          오류 이벤트를 외부에 답인 양 내보내지 마라. 다른 session 끼리는 병렬
                          자유. 최소 한 번(at-least-once) 배달 플랫폼의 중복 이벤트 dedup 도
                          어댑터 소유다.
                  진행    긴 턴의 생존 신호(타이핑 표시·진행 편집)는 관찰 스트림의 delta·tool
                          이벤트로 그린다 — 폴링 축은 은퇴했다. 글자 수 제한, 마크다운 방언,
                          메시지 분할, 레이트리밋 등 외부 표면 형편으로의 번역은 전부
                          어댑터 소유다.
                  파일    회신 파일은 관찰 스트림의 file 이벤트로 온다(path = stage 상대경로) —
                          GET …/file/<경로> 로 받아 네이티브 첨부로 내보낸다. 인바운드 첨부는
                          POST …/upload 로 stage 에 앉힌 뒤 그 참조를 attachments 로 넘긴다.
                  발신    stdin 은 기판의 발신 제어 채널이다. 줄 단위 JSON
                          {"type":"post","conversation":"<대화키>","text":"…","files":["<stage 경로>"]?}
                          를 받으면 그 대화에 게시한다 — 트리거 선톡(then.delivery)이 이
                          길로 온다. 선톡이 대화가 되려면 그 턴은 해당 대화의 session 에서
                          돈다(기판 소관) — 사용자의 후속 발화가 같은 session 에 착신되어
                          맥락을 잇는다.
                  실패    비 200 을 침묵으로 뭉개지 마라 — 외부에도 실패로 알린다. 단 내부
                          사정(토큰·경로·스택)은 싣지 않는다. RELAY_TOKEN 과 자격은 외부
                          대화에 절대 노출 금지.
                  검사    기판 적합성 검사(relay harness-check)는 RELAY_CONFORM=1 로 entry 를
                          스폰한다. 어댑터는 이때 외부 연결 없이 자기 서술 JSON 한 줄
                          {"name":"...","protocol":1} 을 stdout 에 내고 0 으로 종료한다 —
                          자격·네트워크 없이 계약 준수를 기계로 판정하기 위한 문이다.
                  검증    자격이 실제로 먹히는지는 저장과 별개다("저장됨 ≠ 유효"). 기판이
                          RELAY_VERIFY=1 + RELAY_CRED_<이름> 으로 entry 를 스폰하면, 어댑터는
                          소켓·상주 없이 그 자격으로 최소 왕복 한 번(예: 자기 정체 조회)만
                          돌려 판정 JSON 한 줄 {"ok":true/false,"note":"..."} 를 stdout 에 내고
                          종료한다 — 상주 프로세스는 건드리지 않는다. note 에 내부 사정을 싣지
                          마라. 미구현이면 이 문 없이 스폰이 상주로 흐르는데, 그러면 검증이
                          "저장만" 으로 강등되니 화면이 유효 여부를 정직히 표시하려면 구현하라.
                env = RELAY_NAME, RELAY_CHANNEL(이 채널 이름), RELAY_API, RELAY_TOKEN.
                봇 토큰 류 자격은 vault 에 채널 이름 소속으로 앉아(relay connect <패키지>
                <채널이름>) RELAY_CRED_<이름> 으로 주입된다 — 코드·매니페스트에 박지 마라.
                권한 릴레이(진행 턴의 도구 승인 프롬프트를 채널로 중계하고 판정을
                회신받는 축)는 아직 계약 밖이다.
              $ref: '#/$defs/relpath'
            entry:
              description: source 안 어댑터 진입 파일 — 기판 러너가 프로세스로 스폰해 상주시킨다
              $ref: '#/$defs/relpath'
            icon:
              description: 채널 배지 아이콘 (패키지 상대경로, 이미지 파일) — 그래프 카드 상단에 배지로 뜬다
              $ref: '#/$defs/relpath'
            credential:
              description: |
                이 채널이 요구하는 자격의 **형태** 선언. 값이 아니라 형태다 — 값은 vault 에 산다.
                화면(콘솔 채널 다이얼로그)이 이 선언으로 입력 칸을 그린다. 선언이 없으면 화면은
                원시 붙여넣기 칸으로 물러난다: 제3자 어댑터가 선언 없이도 연결 가능해야 하기 때문이다.
                자격 형태를 아는 것은 어댑터뿐인데 화면이 그것을 알 길이 없어서, 지금까지는
                사람이 JSON 을 손으로 조립해야 했다(그 예시가 어댑터의 실제 키와 어긋나 있었다).
                조립 규칙: 모든 field 에 key 가 있으면 화면이 JSON 객체로 조립해 넘기고,
                key 없는 field 하나뿐이면 그 값이 곧 자격 문자열이다. 둘을 섞으면 판정 실패다.
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [label]
                    properties:
                      key:
                        description: 조립될 JSON 키. 생략하면 자격이 문자열 하나라는 뜻(단독일 때만)
                        type: string
                        pattern: '^[a-z][a-z0-9_]*$'
                      label:
                        type: string
                        minLength: 1
                      placeholder:
                        type: string
                      secret:
                        description: 참이면 화면이 값을 가린다. 토큰 류는 참
                        type: boolean
                      list:
                        description: 참이면 쉼표 구분 입력을 배열로 조립한다 (key 있는 필드만)
                        type: boolean
                      required:
                        description: 참이면 이 칸이 비면 화면이 연결을 막는다
                        type: boolean
                help:
                  description: 자격을 어디서 얻는지 — 화면이 링크와 안내로 보여준다
                  type: object
                  additionalProperties: false
                  properties:
                    url:
                      type: string
                    note:
                      type: string
  harness:
    type: object
    additionalProperties: false
    properties:
      variants:
        description: |
          동봉한 하네스 어댑터 후보들(agents 선언 시 최소 1). 선언 = 후보 목록(BOM), 활성 선택 = 장부.
          설치가 각 후보의 setup 을 순서대로 점검해 첫 통과를 활성으로 고르고,
          relay harness <패키지> [이름] 으로 바꾼다
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, source, entry]
          properties:
            name:
              $ref: '#/$defs/slug'
            source:
              description: 실행 어댑터 디렉토리
              $ref: '#/$defs/relpath'
            entry:
              description: |
                source 안 실행 어댑터 파일. 첫 인자가 동사인 프로토콜:
                  session [prompt]  세션 1회 (prompt 없으면 TTY 상속). headless 출력 = 아래 '세션 봉투'
                  setup             진단(읽기). 도구 실재·로그인 점검. 종료코드가 미준비의 축을 가른다:
                                    0 = 준비됨 · 3 = 도구 없음(설치 필요) · 그 외 비0 = 자격 없음(로그인 필요).
                                    사유와 다음 한 걸음을 stdout 에. 화면은 이 축으로 처방을 고르므로
                                    도구 없음을 자격 없음으로 뭉뚱그리면 사용자에게 헛된 토큰 입력창이 뜬다
                  login [--switch|--token]
                                    처방(쓰기). 대화형 인증 — TTY 를 그대로 물려받는다(exec).
                                    자격을 만드는 유일한 동사이므로 setup 이 대신 수행하지 않는다.
                                    이미 로그인된 상태에서도 호출된다 = 계정 전환 경로. --switch 는
                                    기존 자격을 비우고 다시 로그인한다(도구가 '이미 로그인됨' 으로 끝내
                                    전환이 막히는 구현이 있어 전환은 명시 동작이어야 한다).
                                    사람이 볼 터미널 창을 전제하지 마라: 기판은 pty(script)로 감싸
                                    데몬 안에서 돌리고 출력·입력을 화면과 중계한다(headless 로그인).
                                    URL·코드·프롬프트는 평문 한 줄로, 입력은 줄 단위 stdin 으로 받아라.
                                    전체화면 TUI·화면지우기·raw key 입력에 기대면 창을 여는 폴백으로 강등된다
                                    **자격이 도구 소유(oauth·구독)인 어댑터는 login 이 필수다** —
                                    없으면 사용자가 GUI 에서 그 하네스를 쓸 길이 없다. 기판은 터미널 창을
                                    열어 이 동사를 돌린다(POST /pkg/<이름>/harness/login). 인증 자체는
                                    그 창이 소유하고 기판은 문만 연다. --token 은 장기 토큰 발급(선택).
                                    자격이 기판 소유(auth.kind: token)면 login 없이 vault 연결로 충분하다.
                                    지원하면 info.verbs 에 'login' 을 싣는다 — 화면이 이걸 보고 버튼을 띄운다
                  models            지원 모델 목록 (JSON 배열). 모든 항목은 세션의 --model 이 실제로
                                    받는 값이어야 한다. 자격 미도달이면 도구가 스스로 선언하는 어휘
                                    (조회 명령·설정·카탈로그 캐시·--help 의 별칭 문서)까지만 강등하고
                                    사유를 stderr 에 남긴다. 어댑터 소스에 어휘를 하드코딩하지 마라 —
                                    별칭이라도 CLI 버전과 어긋나면 없는 모델이 정본 행세를 한다
                                    (2026-08-07 fable 실사고). 검증할 어휘가 없으면 다음 한 걸음을
                                    적은 안내 항목 하나로 강등한다(빈 목록 금지)
                  commands          하네스 내장 슬래시 커맨드 목록 (JSON 배열 [{name, description, tty}])
                  info              자기 서술 {name, provider, verbs, protocol, capabilities, account}.
                                    protocol 2 = 세션 봉투를 말한다. capabilities 는 구현 의지가 아니라
                                    물리적 능력만 선언한다: cancel(stdin 제어 수신), vision(이미지 해석),
                                    effort(RELAY_EFFORT 반영), resume(네이티브 세션 이어가기)
                세션 봉투 (protocol 2 의 headless 계약): stdout 은 줄 단위 JSON 이벤트다.
                  {"event":"delta","text"}                        중간 텍스트 (충실도는 도구가 주는 만큼)
                  {"event":"tool","name","status":"start"|"end"}  도구 호출 진행
                  {"event":"file","path"}                         stage 상대경로 산출물 (기판 diff 의 보조)
                  {"event":"reply","text","session","model","usage"}  종결, 정확히 한 번. session = 네이티브
                    세션 id, model = 실제 사용 모델, usage = {input, output, context_window} 토큰 장부
                  {"event":"error","message"}                     실패 종결 (exit != 0 과 함께)
                최소 구현 = 종결 reply 한 줄. 실패를 텍스트로 위장하지 않는다 — 실패는 종료코드로,
                사유는 stderr 나 error 이벤트로. stdin 은 제어 채널: {"type":"cancel"} 수신 시 정리 후
                종료(capabilities 에 cancel 선언 시). 미선언 어댑터는 기판이 프로세스를 죽인다.
                봉투 없는 stdout(구형)은 기판이 통짜 응답으로 받아준다 — 신규 어댑터는 봉투가 필수다.
                env = RELAY_NAME, RELAY_AGENT, RELAY_PRINCIPAL, RELAY_API, RELAY_TOKEN, RELAY_SESSION,
                RELAY_BUNDLE, RELAY_MODEL(선택), RELAY_EFFORT(선택 — 모르는 값은 무시).
                같은 RELAY_SESSION 재호출 = 대화 이어가기.
                RELAY_BUNDLE = 중립 번들(persona.md, agents/<sub>.md 본문, skills/, commands/,
                meta.json{pkg, agent, slot, workspace, stage, hooks.deny[], agents[], mcp{url,authorization}}).
                네이티브 형식(설정 파일, 플래그, MCP 배선)으로의 번역은 전부 어댑터 소유이며 산출물은
                번들 안에 쓴다. 불변식 셋: ① 오염 금지 — 사용자의 설정 디렉토리와 cwd(workspace)에
                쓰지 않는다. ② 혼입 금지 — 사용자 개인 설정(스킬·메모리·MCP)이 세션에 새어들지 않게
                한다. ③ 자격 보존 — 도구 자신의 자격 경로(Keychain 등)를 끊지 않는다. 설정 디렉토리
                격리는 자격이 기판 손(env 주입)에 있을 때만 성립한다. hooks.deny 는 네이티브 권한
                규칙 + 훅 가드로 이중 번역한다 (가드레일이지 샌드박스가 아니다)
              $ref: '#/$defs/relpath'
            binary:
              description: |
                이 변형이 모는 실행 파일을 **기판이 얻는 레시피** — requires.binaries 와 같은
                어휘("이 실행 파일이 필요하다")에 획득 방법이 붙은 형이다. 선언하면 기판이 자기
                자리(~/.relay/harness/<패키지>/<변형>/)에 설치하고, 그 하네스의 스폰에만 PATH
                앞에 둔다 — 호스트 전역 설치가 깨져 있어도 패키지가 돈다(어댑터는 번역할 뿐
                동봉하지 않으므로, 이 선언이 없으면 실행 파일의 실재는 사용자 몫이다).
                manager 는 닫힌집합이다: 매니페스트가 셸 문자열을 실행시키지 못한다.
                매니저 자체가 없는 환경은 설치가 fail-loud 하고 **선출이 이 변형을 건너뛴다** —
                다른 변형이 준비돼 있으면 패키지는 그대로 돈다.
              type: object
              additionalProperties: false
              required: [name, manager, package]
              properties:
                name:
                  description: PATH 에서 찾을 실행 파일 이름 (requires.binaries[].name 과 같은 축)
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
                manager:
                  enum: [npm, uv]
                package:
                  description: 매니저의 패키지 좌표 (npm 이름 또는 PyPI 이름)
                  type: string
                  minLength: 1
                version:
                  description: 고정 버전. 생략하면 최신 — 재현성을 포기하는 선언이다
                  type: string
                  minLength: 1
            icon:
              description: 어댑터 도구 아이콘 (패키지 상대경로 이미지) — 카드 하네스 필과 설정 목록에 뜬다
              $ref: '#/$defs/relpath'
            llm:
              description: 이 하네스가 소비하는 LLM provider. 자격은 vault 에 provider 소속(llm/<provider>)으로 앉아 패키지 간 공유. kind token 은 그 값을 auth.env 이름 그대로 주입, kind oauth 는 도구 자신의 로그인(setup 동사가 점검). 미선언 = 어댑터가 자기 도구의 기존 로그인을 쓴다
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: '#/$defs/slug'
                icon:
                  description: provider(모델) 아이콘 (패키지 상대경로 이미지) — 모델 선택 목록과 카드 필에 뜬다
                  $ref: '#/$defs/relpath'
                auth:
                  $ref: '#/$defs/auth'
      workdir:
        description: |
          세션 cwd 의 workspace 하위 상대경로 (미선언 = workspace 루트).
          workspace 자체는 매니페스트가 아니라 설치 결재다 — 사용자가 폴더를 고르고 장부에 남는다
        $ref: '#/$defs/relpath'
  hooks:
    description: |
      세션 담장 선언. deny 경로는 세션의 도구 호출이 닿지 못한다 — 하네스 어댑터가
      네이티브 훅·권한 규칙으로 번역한다. 기판은 자기 홈(~/.relay)을 모든 세션에
      무조건 병합하므로 선언과 무관하게 항상 막힌다. 도구 호출 레벨 가드레일이며
      OS 샌드박스가 아니다 — 신뢰 경계는 배포(서명·심사)가 담당한다
    type: object
    additionalProperties: false
    required: [deny]
    properties:
      deny:
        description: '~ 또는 절대경로 목록. 예: ~/Documents/세무'
        type: array
        minItems: 1
        items:
          type: string
          minLength: 2
          pattern: '^(~($|/)|/)'
          not:
            pattern: '(^|/)\.\.(/|$)'
  auth:
    description: |
      커넥터 계약 — 몸(서비스) 없는 커넥터 패키지의 자격 형태 선언. upstream 이 REST API 라
      스크립트(패키지 동사)가 직접 접속하는 패키지는 이 블록이 계약의 전부다. 자격 값은
      vault 에 패키지 짧은 이름 소속으로 앉고(relay connect <패키지> <짧은이름>), 동사는
      ctx.credential() 로 요청 시점에 꺼낸다 — env 상주 없음. 호스티드 MCP URL 을 주는
      커넥터는 이 블록이 아니라 url 서비스(auth 는 서비스 소속)가 정본 — 동시 선언은
      거부된다(계약 출처는 한 곳). per-user 자격 축(조직 구성원 각자 계정)은 여기가 아니라
      org.per_user.accounts 소관이다 — 개인용/기업용 문법이 갈라지지 않게 하는 자리.
    $ref: '#/$defs/auth'
  agents:
    description: |
      착지점 = default: true 선언 에이전트, 미선언이면 패키지 짧은 이름과 같은 에이전트 관례.
      persona 는 agents/<name>/AGENT.md
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, persona]
      properties:
        name:
          $ref: '#/$defs/slug'
        default:
          description: main 슬롯 착지점 — 최대 1. 명시 선언은 "짧은 이름과 같은 에이전트" 관례의 상위 호환
          type: boolean
        persona:
          description: 페르소나 마크다운 파일
          $ref: '#/$defs/relpath'
        skills:
          description: 스킬 디렉토리 (<skill>/SKILL.md) — 하네스 네이티브 스킬로 조립
          $ref: '#/$defs/relpath'
        commands:
          description: 슬래시 커맨드 디렉토리 (<cmd>.md) — 하네스 네이티브 커맨드로 조립, TTY 와 headless 양쪽에서 동작
          $ref: '#/$defs/relpath'
        dispatch:
          type: array
          items:
            $ref: '#/$defs/slug'
        scripts:
          description: 세션에 조립되는 동사 scope. scripts/<이름>.ts 실재 검증(fail-loud), 접두 glob 허용
          type: array
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*\*?$'
  scripts:
    description: |
      동사 디렉토리. <이름>.ts = 기본 수출 async 함수 (input, ctx) => 결과 JSON.
      동사는 meta 를 함께 수출할 수 있다 — 세션 문(MCP tools/list)이 그 서술과 입력 형을 싣는다:
      export const meta = { description: "…", input: {type:"object", …}, output: {…} }.
      이름은 meta 에 없다(파일명이 정본 — 두 곳에 적으면 어긋난다). input/output 은 JSON Schema
      리터럴이고 기판은 형을 광고만 한다: 검증기는 의존이고 의존성 0 규율이 형 광고보다 먼저다
      (입력 판정은 동사 본문의 몫). 미지 키는 무시된다 — meta 는 코드지 manifest 가 아니라
      선언-실체 판정의 대상이 아니다. meta 없는 동사는 무변 — 서술은 기판이 자동 합성하고
      입력 형은 개방 스키마가 된다.
    type: object
    additionalProperties: false
    required: [source]
    properties:
      source:
        $ref: '#/$defs/relpath'
  services:
    type: array
    items:
      oneOf:
        - $ref: '#/$defs/sourceService'
        - $ref: '#/$defs/urlService'
        - $ref: '#/$defs/dirService'
  triggers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, when, then]
      properties:
        id:
          $ref: '#/$defs/slug'
        label:
          description: 표시명 (선택) — 화면 목록이 id 대신 그린다
          type: string
          minLength: 1
        when:
          oneOf:
            - type: object
              additionalProperties: false
              required: [cron]
              properties:
                cron:
                  type: string
                  minLength: 1
                tz:
                  type: string
            - type: object
              additionalProperties: false
              required: [event]
              properties:
                event:
                  type: string
                  minLength: 1
                filter:
                  type: object
                debounce_ms:
                  type: integer
                  minimum: 0
        then:
          oneOf:
            - type: object
              additionalProperties: false
              required: [agent, prompt]
              properties:
                agent:
                  $ref: '#/$defs/slug'
                prompt:
                  type: string
                  minLength: 1
                route:
                  type: string
                  pattern: '^/'
                delivery:
                  description: |
                    선톡 좌표 '<채널이름>:<대화키>'. 기판이 이 트리거의 턴을 그 대화의
                    slot(<채널이름>-<대화키>)에서 돌리고, reply 를 어댑터 stdin 발신
                    (post)으로 배달한다 — 후속 발화가 같은 slot 에 착신되어 대화가 이어진다.
                    미선언 = 세션 결과가 콘솔 세션 목록(trigger-<id> slot)에만 남는다
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,39}:.+$'
            - type: object
              additionalProperties: false
              required: [script]
              properties:
                script:
                  description: scripts/<이름>.ts headless 실행(세션 없음)
                  $ref: '#/$defs/slug'
  missions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
  edges:
    description: |
      선언은 신청, 활성화는 결재. 혈통이 같은 설치본이 여럿이면 결재가 디렉토리에 바인딩한다.
      소비물은 셋 중 하나다(동시 선언 불가): tools(동사, 런타임 결재) · mission(질의,
      런타임 결재) · components(제공자의 surfaces.components 를 view 빌드 의존으로 —
      집행점이 런타임이 아니라 빌드라, 활성화는 빌드 해석 성공이 곧 결재 기록이다)
    type: array
    items:
      type: object
      additionalProperties: false
      required: [provider]
      not:
        anyOf:
          - required: [tools, mission]
          - required: [tools, components]
          - required: [mission, components]
      properties:
        provider:
          $ref: '#/$defs/provider'
        tools:
          type: array
          items:
            $ref: '#/$defs/slug'
        mission:
          type: string
          minLength: 1
        components:
          description: provider 의 surfaces.components 소스를 이 패키지 view 의 빌드 의존으로 소비 — true 만
          const: true
  host_methods:
    description: |
      기판 host 브리지 게이트 선언 — 이 패키지의 동사가 부를 수 있는 host.* 메서드의 캡.
      선언은 캡이고 집행은 기판 소유다: ring-0 설치 결재가 문을 열고, 선언이 있으면 목록 밖
      메서드는 거부된다(미선언 = 전체, ring-0 결재가 유일한 경계 — 현행 호환). 고지서에
      실린다. 개인 기판의 메서드 이름은 host.<동사_스네이크>(예 host.draft_publish),
      org 기판은 host.<도메인>.<동사>(예 host.members.list) — 두 표기 모두 이 문법 안이다.
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^host\.[A-Za-z0-9]+([._][A-Za-z0-9]+)*$'
  storage:
    description: |
      파일 버킷 파사드 선언. services[].disk(몸 디스크)와 전혀 다른 축이다.
      1인 기판은 v1 에서 판정만 하고 집행하지 않는다(추후 로컬 구현 여지). org 기판은
      storage-api 로 버킷을 보장한다. 정책은 닫힌 프리셋 — 자유 문자열이 되는 순간
      기판마다 다른 뜻이 된다.
    type: object
    additionalProperties: false
    required: [buckets]
    properties:
      buckets:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              $ref: '#/$defs/slug'
            policy:
              enum: [org-member, owner-only, role-based]
  org:
    description: org 기판이 호스팅할 때만 읽는 확장. 1인 기판과 등록 노드에서는 무시된다
    type: object
    additionalProperties: false
    properties:
      per_user:
        type: object
        additionalProperties: false
        properties:
          accounts:
            description: 자격 축. url/dir 서비스 이름, edge provider 좌표, 또는 커넥터 계약(최상위 auth)의 패키지 짧은 이름
            type: array
            items:
              type: string
              minLength: 1
          replicas:
            description: 복제 축. source 서비스 이름만, disk 와 병용 불가
            type: array
            items:
              $ref: '#/$defs/slug'
$defs:
  slug:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
  relpath:
    type: string
    minLength: 1
    allOf:
      - not:
          pattern: '^[/~]'
      - not:
          pattern: '(^|/)\.\.(/|$)'
  dirpath:
    type: string
    minLength: 1
    allOf:
      - not:
          pattern: '^/'
      - not:
          pattern: '(^|/)\.\.(/|$)'
  provider:
    type: string
    pattern: '^@[a-z0-9-]+/[a-z0-9][a-z0-9-]{1,39}(@[^\s@]+)?$'
  resources:
    type: object
    additionalProperties: false
    properties:
      memory:
        type: string
        pattern: '^\d+(Mi|Gi)$'
      cpu:
        type: number
        exclusiveMinimum: 0
  auth:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: none
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: token
          env:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
          service:
            description: org 기판 자격 브로커의 서비스 키 (예 google-drive) — 브로커 없는 기판은 무시
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          help:
            type: object
            additionalProperties: false
            properties:
              url:
                type: string
              note:
                type: string
          verify:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url:
                type: string
              headers:
                type: object
                additionalProperties:
                  type: string
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: oauth
          client:
            enum: [dcr, registered]
          service:
            description: org 기판 자격 브로커의 서비스 키 — 브로커 없는 기판은 무시
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          oauth_client:
            type: object
            additionalProperties: false
            properties:
              scopes:
                type: array
                items:
                  type: string
              auth_meta:
                type: object
                additionalProperties: false
                properties:
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  registration_endpoint:
                    type: string
                  authorize_params:
                    type: object
                    additionalProperties:
                      type: string
  sourceService:
    type: object
    additionalProperties: false
    required: [name, source]
    anyOf:
      - required: [dockerfile]
      - required: [entry]
    properties:
      name:
        $ref: '#/$defs/slug'
      source:
        description: 서비스 몸 디렉토리. env = RELAY_NAME, RELAY_API, RELAY_TOKEN. 선언한 port 에서 listen, 영속 데이터는 /data(disk 선언 시)
        $ref: '#/$defs/relpath'
      dockerfile:
        description: 컨테이너 형 — 발행·설치가 굽는다
        $ref: '#/$defs/relpath'
      entry:
        description: 프로세스 형 진입 파일 — 기판 러너가 실행
        $ref: '#/$defs/relpath'
      disk:
        type: string
        pattern: '^\d+(Mi|Gi)$'
      resources:
        $ref: '#/$defs/resources'
      port:
        type: integer
        minimum: 1
        maximum: 65535
  urlService:
    type: object
    additionalProperties: false
    required: [name, url]
    properties:
      name:
        $ref: '#/$defs/slug'
      url:
        type: string
        pattern: '^https?://'
      tools:
        type: array
        items:
          $ref: '#/$defs/slug'
      auth:
        $ref: '#/$defs/auth'
  dirService:
    type: object
    additionalProperties: false
    required: [name, dir]
    properties:
      name:
        $ref: '#/$defs/slug'
      dir:
        description: 상대경로 = 패키지 내부(자기 소유), '~' 경로 = 신청(설치 결재로 바인딩)
        $ref: '#/$defs/dirpath'
